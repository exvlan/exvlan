packages:
  - packages/ui
  - packages/std
  - packages/studio
  - exvlan/plugin/vpnservice

allowBuilds:
  esbuild: false
  ip-num: false
  unrs-resolver: true
  vue-demi: true
minimumReleaseAgeExclude:
  - '@babel/generator@8.0.0'
  - '@babel/helper-string-parser@8.0.0'
  - '@babel/helper-validator-identifier@8.0.0'
  - '@babel/parser@8.0.0'
  - '@babel/types@8.0.0'
  - ast-kit@3.0.0
  - rolldown-plugin-dts@0.26.0
  - tsdown@0.22.3
overrides:
  '@vue/language-core': ^3.3.9
  minimatch: ^10.2.6
  typescript: npm:typescript@6.0.3
  vite: 'catalog:'
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.8
  vite-plus: 0.2.8
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
patchedDependencies:
  '@primevue/core@5.0.0': patches/@primevue__core@5.0.0.patch
