packages:
  - packages/generator
  - packages/ui
  - packages/std
  - packages/studio
  - exvlan/plugin/vpnservice

allowBuilds:
  esbuild: false
  ip-num: false
  unrs-resolver: true
  vue-demi: true
minimumReleaseAgeExclude:
  - "@babel/generator@8.0.0"
  - "@babel/helper-string-parser@8.0.0"
  - "@babel/helper-validator-identifier@8.0.0"
  - "@babel/parser@8.0.0"
  - "@babel/types@8.0.0"
  - ast-kit@3.0.0
  - rolldown-plugin-dts@0.26.0
  - tsdown@0.22.3
  - "@openuxkit/themes@1.2.0"
  - "@openvue/auto-import-resolver@1.1.0"
  - "@openvue/core@1.1.0"
  - "@openvue/icons@1.1.0"
  - "@openvue/metadata@1.1.0"
  - "@openvue/themes@1.1.0"
  - openvue@1.1.0
overrides:
  "js-yaml@>=4.0.0 <4.3.2": "4.3.2"
  minimatch: ^11.0.3
  vite: "catalog:"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plus: latest
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
