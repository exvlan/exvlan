name: Exvlan Dependency Audit

# 统一入口编排：只提供 workflow_call/workflow_dispatch，由 pipeline.yml 调用。
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency audit (cargo + pnpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          toolchain: 1.95
          cache: false
          rustflags: ""

      - uses: taiki-e/install-action@3e95b5d2ea53a19022dddec602c648200467d281 # cargo-audit

      # 允许清单在 .cargo/audit.toml：清单内为「已评估接受」，清单外的新漏洞 → 红灯。
      # 元数据（理由/复核日）在 .cargo/audit-allowlist.toml；过期或两处不一致 → 先失败。
      - name: Check audit allow-list
        run: python3 script/check_audit_allowlist.py

      - name: cargo audit
        run: cargo audit

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12
          run_install: false

      # 只看**生产依赖**（--prod）：dev/build 链的告警不阻塞发布，但会被 Dependabot 记录（见 docs/security/dependabot-triage-*）。
      - name: pnpm audit (prod)
        run: |
          set -euo pipefail
          pnpm install --ignore-scripts --no-frozen-lockfile
          pnpm audit --prod --registry https://registry.npmjs.org
          pnpm --dir packages/sdk install --frozen-lockfile --ignore-scripts
          pnpm --dir packages/sdk audit --prod --registry https://registry.npmjs.org
