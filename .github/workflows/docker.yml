name: Builder Docker

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'The run id of Core Action in exvlan repo'
        type: number
        default: 10228239965
        required: true
      image_tag:
        description: 'Tag for this image build'
        type: string
        default: 'v2.6.0'
        required: true
      mark_latest:
        description: 'Mark this image as latest'
        type: boolean
        default: false
        required: true
      mark_unstable:
        description: 'Mark this image as unstable'
        type: boolean
        default: false
        required: true

jobs:
  docker:
    if: contains(fromJSON('["era-cloud", "exvlan"]'), github.actor)
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v6
      -
        name: Validate inputs
        run: |
          if [[ "${{ inputs.mark_latest }}" == "true" && "${{ inputs.mark_unstable }}" == "true" ]]; then
            echo "Error: mark_latest and mark_unstable cannot both be true"
            exit 1
          fi
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: login github container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download artifact
        id: download-artifact
        uses: dawidd6/action-download-artifact@v20
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          run_id: ${{ inputs.run_id }}
          repo: ${{ github.repository }}
          path: docker_context
      - name: List files
        run: |
          ls -l -R .
      - name: Prepare Docker tags
        id: tags
        run: |
          # Base tags with version
          GHCR_TAGS="ghcr.io/${{ github.repository_owner }}/exvlan:${{ inputs.image_tag }}"
          # Add alpha tag if this is an alpha release
          if [[ "${{ inputs.is_alpha }}" == "true" ]]; then
            GHCR_TAGS="${GHCR_TAGS},ghcr.io/${{ github.repository_owner }}/exvlan:alpha"
          # Add latest tags if requested
          elif [[ "${{ inputs.mark_latest }}" == "true" ]]; then
            GHCR_TAGS="${GHCR_TAGS},ghcr.io/${{ github.repository_owner }}/exvlan:latest"
          fi

          # Add unstable tags if requested
          if [[ "${{ inputs.mark_unstable }}" == "true" ]]; then
            GHCR_TAGS="${GHCR_TAGS},ghcr.io/${{ github.repository_owner }}/exvlan:unstable"
          fi

          # Combine all tags
          ALL_TAGS="${GHCR_TAGS}"

          echo "tags=${ALL_TAGS}" >> $GITHUB_OUTPUT
          echo "Generated tags: ${ALL_TAGS}"
      -
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./docker_context
          platforms: linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64,linux/riscv64
          push: true
          file: .github/workflows/Dockerfile
          tags: ${{ steps.tags.outputs.tags }}
