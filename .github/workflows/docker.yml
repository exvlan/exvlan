name: Builder Docker

on:
  workflow_call:
    inputs:
      mark_latest:
        description: "Mark this image as latest"
        type: boolean
        default: false
        required: true
      mark_unstable:
        description: "Mark this image as unstable"
        type: boolean
        default: false
        required: true
      is_alpha:
        description: "Mark this image as alpha"
        type: boolean
        default: false
        required: true

  workflow_dispatch:
    inputs:
      run_id:
        description: "The run id of Core Action in exvlan repo"
        type: number
        default: 10228239965
        required: true
      image_tag:
        description: "Tag for this image build"
        type: string
        default: "v26.410.20704"
        required: true
      mark_latest:
        description: "Mark this image as latest"
        type: boolean
        default: false
        required: true
      mark_unstable:
        description: "Mark this image as unstable"
        type: boolean
        default: false
        required: true
      is_alpha:
        description: "Mark this image as alpha"
        type: boolean
        default: false
        required: true

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  docker:
    if: contains(fromJSON('["era-cloud", "exvlan", "littlezo"]'), github.actor)
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate inputs
        run: |
          if [[ "${{ inputs.mark_latest }}" == "true" && "${{ inputs.mark_unstable }}" == "true" ]]; then
            echo "Error: mark_latest and mark_unstable cannot both be true"
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # core 二进制由 Build Core 存入 actions/cache（artifact 存储配额已超限，不走上传/下载 artifact）
      - name: Restore core binaries (x86_64)
        uses: actions/cache/restore@v4
        with:
          {
            key: "core-${{ github.sha }}-linux-x86_64",
            path: ./artifacts,
            fail-on-cache-miss: true,
          }
      - run: mkdir -p docker_context/exvlan-linux-x86_64 && mv ./artifacts/* docker_context/exvlan-linux-x86_64/ && rm -rf ./artifacts

      - name: Restore core binaries (armhf)
        uses: actions/cache/restore@v4
        with:
          { key: "core-${{ github.sha }}-linux-armhf", path: ./artifacts, fail-on-cache-miss: true }
      - run: mkdir -p docker_context/exvlan-linux-armhf && mv ./artifacts/* docker_context/exvlan-linux-armhf/ && rm -rf ./artifacts

      - name: Restore core binaries (armv7hf)
        uses: actions/cache/restore@v4
        with:
          {
            key: "core-${{ github.sha }}-linux-armv7hf",
            path: ./artifacts,
            fail-on-cache-miss: true,
          }
      - run: mkdir -p docker_context/exvlan-linux-armv7hf && mv ./artifacts/* docker_context/exvlan-linux-armv7hf/ && rm -rf ./artifacts

      - name: Restore core binaries (aarch64)
        uses: actions/cache/restore@v4
        with:
          {
            key: "core-${{ github.sha }}-linux-aarch64",
            path: ./artifacts,
            fail-on-cache-miss: true,
          }
      - run: mkdir -p docker_context/exvlan-linux-aarch64 && mv ./artifacts/* docker_context/exvlan-linux-aarch64/ && rm -rf ./artifacts

      - name: List files (Debug)
        run: ls -l -R ./docker_context

      - name: Prepare Docker tags
        id: tags
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_NAME="exvlan"
          BASE_IMAGE="ghcr.io/${OWNER}/${REPO_NAME}"

          IMAGE_TAG="${{ inputs.image_tag }}"
          if [ -z "$IMAGE_TAG" ]; then
            # 从 pipeline (workflow_call) 调用时未传 image_tag，使用 commit SHA 兜底
            IMAGE_TAG="${GITHUB_SHA:0:8}"
          fi

          TAGS="${BASE_IMAGE}:${IMAGE_TAG}"

          if [[ "${{ inputs.mark_latest }}" == "true" ]]; then
            # release：主镜像打 latest，registry 镜像打 registry
            TAGS="${TAGS},${BASE_IMAGE}:latest"
            REGISTRY_TAG="${BASE_IMAGE}:registry"
          else
            # 分支构建：主镜像打 alpha，registry 镜像打 registry-alpha
            TAGS="${TAGS},${BASE_IMAGE}:alpha"
            REGISTRY_TAG="${BASE_IMAGE}:registry-alpha"
          fi

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            # tag 推送追加版本标签（如 v26.410.20704）
            TAGS="${TAGS},${BASE_IMAGE}:${{ github.ref_name }}"
          fi

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "Generated tags: ${TAGS}"
          echo "registry_tag=${REGISTRY_TAG}" >> $GITHUB_OUTPUT

      - name: Build and push (exvlan)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./docker_context
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64
          push: true
          file: .github/workflows/Dockerfile
          target: exvlan
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push (registry)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./docker_context
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64
          push: true
          file: .github/workflows/Dockerfile
          target: registry
          tags: ${{ steps.tags.outputs.registry_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
