name: EXVlan Docker

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'The run id of EXVlan-Core Action in EXVlan repo'
        type: number
        default: 10228239965
        required: true
      image_tag:
        description: 'Tag for this image build'
        type: string
        default: 'v2.6.0'
        required: true
      mark_latest:
        description: 'Mark this image as latest'
        type: boolean
        default: false
        required: true
      mark_unstable:
        description: 'Mark this image as unstable'
        type: boolean
        default: false
        required: true

env:
jobs:
  docker:
    if: contains(fromJSON('["era-cloud", "littlezo"]'), github.actor)
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v6
      -
        name: Check if alpha build
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: login github container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download artifact
        id: download-artifact
        uses: dawidd6/action-download-artifact@v20
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          run_id: ${{ inputs.run_id }}
          repo: ${{ github.repository }}
          path: docker_context
      - name: List files
        run: |
          ls -l -R .
      - name: Check if alpha build
        id: check_alpha
        run: |
          # Check if this run_id comes from alpha-release workflow
          WORKFLOW_NAME=$(gh run view ${{ inputs.run_id }} --json workflowName -q '.workflowName')
          if [[ "$WORKFLOW_NAME" == "EXVlan Alpha Release" ]]; then
            echo "is_alpha=true" >> $GITHUB_OUTPUT
            echo "This is an alpha build"
          else
            echo "is_alpha=false" >> $GITHUB_OUTPUT
            echo "This is a regular build"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Docker tags
        id: tags
        run: |
          # Always use alpha tag for docker builds
          DOCKERHUB_TAGS="exvlan/exvlan:alpha"
          GHCR_TAGS="ghcr.io/${{ github.repository_owner }}/exvlan:alpha"

          # Combine all tags
          ALL_TAGS="${DOCKERHUB_TAGS},${GHCR_TAGS}"

          echo "tags=${ALL_TAGS}" >> $GITHUB_OUTPUT
          echo "Generated tags: ${ALL_TAGS}"
      -
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./docker_context
          platforms: linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64,linux/riscv64
          push: true
          file: .github/workflows/Dockerfile
          tags: ${{ steps.tags.outputs.tags }}
