name: Builder Docker

on:
  workflow_call:
    inputs:
      mark_latest:
        description: 'Mark this image as latest'
        type: boolean
        default: false
        required: true
      mark_unstable:
        description: 'Mark this image as unstable'
        type: boolean
        default: false
        required: true
      is_alpha:
        description: 'Mark this image as alpha'
        type: boolean
        default: false
        required: true

  workflow_dispatch:
    inputs:
      run_id:
        description: 'The run id of Core Action in exvlan repo'
        type: number
        default: 10228239965
        required: true
      image_tag:
        description: 'Tag for this image build'
        type: string
        default: 'v26.206.1010000'
        required: true
      mark_latest:
        description: 'Mark this image as latest'
        type: boolean
        default: false
        required: true
      mark_unstable:
        description: 'Mark this image as unstable'
        type: boolean
        default: false
        required: true
      is_alpha:
        description: 'Mark this image as alpha'
        type: boolean
        default: false
        required: true

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  docker:
    if: contains(fromJSON('["era-cloud", "exvlan", "littlezo"]'), github.actor)
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate inputs
        run: |
          if [[ "${{ inputs.mark_latest }}" == "true" && "${{ inputs.mark_unstable }}" == "true" ]]; then
            echo "Error: mark_latest and mark_unstable cannot both be true"
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all artifacts from workflow run
        if: inputs.run_id == ''
        uses: actions/download-artifact@v8
        with:
          path: docker_context
          merge-multiple: true

      - name: List downloaded files (Debug)
        run: |
          echo "=== Docker context contents ==="
          find ./docker_context -type f | head -50
          echo "=== Directories ==="
          find ./docker_context -type d | head -20

      - name: Download artifact from run_id
        if: inputs.run_id != ''
        id: download-artifact
        uses: dawidd6/action-download-artifact@v21
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          run_id: ${{ inputs.run_id }}
          repo: ${{ github.repository }}
          path: docker_context

      - name: List files (Debug)
        run: ls -l -R ./docker_context

      - name: Prepare Docker tags
        id: tags
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_NAME="exvlan"
          BASE_IMAGE="ghcr.io/${OWNER}/${REPO_NAME}"

          TAGS="${BASE_IMAGE}:${{ inputs.image_tag }}"

          if [[ "${{ inputs.is_alpha }}" == "true" ]]; then
            TAGS="${TAGS},${BASE_IMAGE}:alpha"
          elif [[ "${{ inputs.mark_latest }}" == "true" ]]; then
            TAGS="${TAGS},${BASE_IMAGE}:latest"
          fi

          if [[ "${{ inputs.mark_unstable }}" == "true" ]]; then
            TAGS="${TAGS},${BASE_IMAGE}:unstable"
          fi

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "Generated tags: ${TAGS}"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./docker_context
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64
          push: true
          file: .github/workflows/Dockerfile
          tags: ${{ steps.tags.outputs.tags }}
