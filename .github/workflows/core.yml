name: Builder Core

on:
  workflow_call:
    inputs:
      targets:
        description: 'Build targets: JSON array of target triples, or "all"'
        type: string
        default: 'all'
  workflow_dispatch:
    inputs:
      targets:
        description: 'Build targets: JSON array of target triples, or "all"'
        default: 'all'

permissions:
  contents: read
  actions: write

concurrency:
  group: core-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  pre_job:
    name: Run Pre check
    # continue-on-error: true # Uncomment once integration is finished
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    # Map a step output to a job output
    outputs:
      # do not skip push on branch starts with releases/
      should_skip: ${{ steps.skip_check.outputs.should_skip == 'true' && !startsWith(github.ref_name, 'releases/') }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          # All of these options are optional, so you can remove them if you are happy with the defaults
          concurrent_skipping: 'same_content_newer'
          skip_after_successful_duplicate: 'true'
          cancel_others: 'true'
          paths: '["Cargo.toml", "Cargo.lock", "exvlan/core/**", ".github/workflows/core.yml", ".github/actions/**", "exvlan/api/**", "packages/ui/**", "packages/kit/**"]'
  dashboard:
    name: Build Kit & Dashboard
    runs-on: ubuntu-latest
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Frontend Environment
        uses: ./.github/actions/prepare-pnpm
        with:
          build-filter: './packages/*'

      - name: Archive artifact
        uses: actions/upload-artifact@v7
        with:
          name: exvlan-dashboard
          path: |
            packages/ui/dist/*

      - name: Setup tmate session
        if: failure()
        uses: mxschmitt/action-tmate@v3
        with:
          detached: true
          limit-access-to-actor: true
          timeout-minutes: 3

  prepare_matrix:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    outputs:
      include: ${{ steps.gen.outputs.include }}
    steps:
      - name: Generate matrix include
        id: gen
        run: |
          python3 - "${{ inputs.targets }}" <<'PY'
          import json, sys

          ALL = [
            {"TARGET": "x86_64-unknown-linux-musl", "OS": "ubuntu-24.04", "ARTIFACT_NAME": "linux-x86_64"},
            {"TARGET": "aarch64-unknown-linux-musl", "OS": "ubuntu-24.04-arm", "ARTIFACT_NAME": "linux-aarch64"},
            {"TARGET": "armv7-unknown-linux-musleabihf", "OS": "ubuntu-24.04", "ARTIFACT_NAME": "linux-armv7hf"},
            {"TARGET": "armv7-unknown-linux-musleabi", "OS": "ubuntu-24.04", "ARTIFACT_NAME": "linux-armv7"},
            {"TARGET": "arm-unknown-linux-musleabihf", "OS": "ubuntu-24.04", "ARTIFACT_NAME": "linux-armhf"},
            {"TARGET": "arm-unknown-linux-musleabi", "OS": "ubuntu-24.04", "ARTIFACT_NAME": "linux-arm"},
            {"TARGET": "x86_64-unknown-freebsd", "OS": "ubuntu-24.04", "ARTIFACT_NAME": "freebsd-13.2-x86_64", "BSD_VERSION": "13.2"},
            {"TARGET": "x86_64-apple-darwin", "OS": "macos-latest", "ARTIFACT_NAME": "macos-x86_64"},
            {"TARGET": "aarch64-apple-darwin", "OS": "macos-latest", "ARTIFACT_NAME": "macos-aarch64"},
            {"TARGET": "x86_64-pc-windows-msvc", "OS": "windows-latest", "ARTIFACT_NAME": "windows-x86_64"},
            {"TARGET": "aarch64-pc-windows-msvc", "OS": "windows-11-arm", "ARTIFACT_NAME": "windows-arm64"},
          ]

          selected = sys.argv[1]
          if selected == "all":
              result = ALL
          else:
              wanted = set(json.loads(selected))
              result = [e for e in ALL if e["TARGET"] in wanted]
          print("include=" + json.dumps(result))
          PY

  build:
    name: Build Core ${{ matrix.ARTIFACT_NAME }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare_matrix.outputs.include) }}

    runs-on: ${{ matrix.OS }}
    env:
      NAME: exvlan
      TARGET: ${{ matrix.TARGET }}
      OS: ${{ matrix.OS }}
    needs: [ pre_job, dashboard, prepare_matrix ]
    if: ${{ needs.pre_job.outputs.should_skip != 'true' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set current ref as env variable
        run: |
          echo "GIT_DESC=$(git log -1 --format=%cd.%h --date=format:%Y-%m-%d_%H:%M:%S)" >> $GITHUB_ENV

      - name: Download web artifact
        uses: actions/download-artifact@v8
        with:
          name: exvlan-dashboard
          path: packages/ui/dist/

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          target: ${{ matrix.TARGET }}
          gui: true
          pnpm: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ""
          shared-key: "exvlan-shared"
          cache-targets: true

      - uses: jdx/mise-action@v4
        if: ${{ contains(matrix.OS, 'ubuntu') }}
        with:
          install_args: 'zig@0.16.0'
          cache_key_prefix: 'mise-zig'

      - uses: taiki-e/install-action@v2
        if: ${{ contains(matrix.OS, 'ubuntu') }}
        with:
          tool: cargo-zigbuild

      - name: Build (${{ matrix.ARTIFACT_NAME }})
        if: ${{ !contains(matrix.TARGET, 'mips') }}
        run: |
          export PATH="$PATH:$HOME/.cargo/bin"
          SUFFIX=$([[ "$TARGET" == *windows* ]] && echo ".exe" || echo "")
          BUILD=$([[ "$TARGET" =~ (x86_64-unknown-linux-musl|aarch64-unknown-linux-musl|windows|darwin) ]] && echo "build" || echo "zigbuild")
          FEATURES=$([[ "$TARGET" =~ ^(riscv64|loongarch64|aarch64).*$ || "$TARGET" =~ (freebsd|windows) ]] && echo "mimalloc" || echo "jemalloc")
          
          cargo $BUILD --release --target $TARGET --package=exvlan-api --features=embed
          mv ./target/$TARGET/release/exvlan-api"$SUFFIX" ./target/$TARGET/release/exvlan-api-embed"$SUFFIX"
          cargo $BUILD --release --target $TARGET --features=$FEATURES

      - name: Build (MIPS) (${{ matrix.ARTIFACT_NAME }})
        if: ${{ contains(matrix.TARGET, 'mips') }}
        env:
          RUSTC_BOOTSTRAP: 1
          RUSTFLAGS: "--cfg portable_atomic_unsafe_assume_single_core"
        run: |
          cargo build -r --target $TARGET -Z build-std=std,panic_abort --package=exvlan --features=jemalloc

      - name: Compress
        run: |
          mkdir -p ./artifacts/objects/

          # windows is the only OS using a different convention for executable file name
          if [[ $OS =~ ^windows.*$ ]]; then
              SUFFIX=.exe
              case $TARGET in
                  x86_64*)  ARCH_DIR=x86_64 ;;
                  i686*)    ARCH_DIR=i686 ;;
                  aarch64*) ARCH_DIR=arm64 ;;
              esac
              if [[ -n "$ARCH_DIR" ]]; then
                  find "exvlan/core/third_party/${ARCH_DIR}" -maxdepth 1 -type f \( -name "*.dll" -o -name "*.sys" \) -exec cp {} ./artifacts/objects/ \;
              fi
          fi

          if [[ $GITHUB_REF_TYPE =~ ^tag$ ]]; then
            TAG=$GITHUB_REF_NAME
          else
            TAG=$GITHUB_SHA
          fi
          
          if [[ $OS =~ ^ubuntu.*$ && ! $TARGET =~ (loongarch|freebsd) ]]; then
            HOST_ARCH=$(uname -m)
            case $HOST_ARCH in
              x86_64)  UPX_ARCH="amd64" ;;
              aarch64) UPX_ARCH="arm64" ;;
              armv7*)  UPX_ARCH="arm" ;;
              *)       UPX_ARCH="amd64" ;;
            esac

            UPX_VERSION=4.2.4
            UPX_PKG="upx-${UPX_VERSION}-${UPX_ARCH}_linux"
            UPX_URL="https://github.com/upx/upx/releases/download/v${UPX_VERSION}/${UPX_PKG}.tar.xz"
            
            echo "⬇️ Downloading UPX from: $UPX_URL"
            
            if curl  -f -s -L "$UPX_URL" -o upx.tar.xz; then
              # 解压并移动二进制文件到当前目录
              tar -xJvf upx.tar.xz
              cp "${UPX_PKG}/upx" .
              UPX_BIN=./upx
              echo "✅ UPX installed successfully."
            else
              echo "❌ Failed to download UPX, skipping compression."
            fi
          fi

          for BIN in ./target/$TARGET/release/{exvlan,exvlan-cli,exvlan-api,exvlan-api-embed}"$SUFFIX"; do
            if [[ -f "$BIN" ]]; then
              if [[ -n "$UPX_BIN" ]]; then
                $UPX_BIN --lzma --best "$BIN" || true
              fi

              mv "$BIN" ./artifacts/objects/
            fi
          done

          mv ./artifacts/objects/* ./artifacts/
          rm -rf ./artifacts/objects/

      - name: Archive artifact
        uses: actions/upload-artifact@v7
        with:
          name: exvlan-${{ matrix.ARTIFACT_NAME }}
          path: |
            ./artifacts/*

      - name: Setup tmate session
        if: failure()
        uses: mxschmitt/action-tmate@v3
        with:
          detached: true
          limit-access-to-actor: true
          timeout-minutes: 3

  magisk:
    name: Build Magisk Module
    runs-on: ubuntu-latest
    needs: [ pre_job, dashboard, build ]
    # if: needs.pre_job.result == 'success' && needs.pre_job.outputs.should_skip != 'true' && !cancelled()
    if: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7  # 必须先检出代码才能获取模块配置

      # 下载二进制文件到独立目录
      - name: Download Linux aarch64 binaries
        uses: actions/download-artifact@v8
        with:
          name: exvlan-linux-aarch64
          path: ./downloaded-binaries/  # 独立目录避免冲突

      # 将二进制文件复制到 Magisk 模块目录
      - name: Prepare binaries
        run: |
          mkdir -p ./exvlan-contrib/magisk/
          cp ./downloaded-binaries/exvlan ./exvlan-contrib/magisk/
          cp ./downloaded-binaries/exvlan-cli ./exvlan-contrib/magisk/
          cp ./downloaded-binaries/exvlan-api ./exvlan-contrib/magisk/

      # 上传生成的模块
      - name: Upload Magisk Module
        uses: actions/upload-artifact@v7
        with:
          name: exvlan-magisk
          path: |
            ./exvlan-contrib/magisk
            !./exvlan-contrib/magisk/build.sh
            !./exvlan-contrib/magisk/magisk_update.json
          if-no-files-found: error

  result:
    name: Core Result Check
    runs-on: ubuntu-latest
    needs: [ pre_job, dashboard, build ]
    if: needs.pre_job.result == 'success' && needs.pre_job.outputs.should_skip != 'true' && !cancelled()
    steps:
      - name: Mark result as failed
        if: contains(needs.*.result, 'failure')
        run: exit 1
