name: EXVlan Test

on:
  push:
    branches: [ "develop", "main", "feature/*" ]
  pull_request:
    branches: [ "develop", "main" ]

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
#  RUSTC_WRAPPER: "sccache"
#  SCCACHE_GHA_ENABLED: "true"

defaults:
  run:
    # necessary for windows
    shell: bash

jobs:
  pre_job:
    name: Run Pre check
    # continue-on-error: true # Uncomment once integration is finished
    runs-on: ubuntu-latest
    # Map a step output to a job output
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          # All of these options are optional, so you can remove them if you are happy with the defaults
          concurrent_skipping: 'never'
          skip_after_successful_duplicate: 'true'
          paths: '["Cargo.toml", "Cargo.lock", "exvlan/**", ".github/workflows/test.yml", ".github/actions/**"]'

  check:
    name: Run linters & check
    runs-on: ubuntu-latest
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          gui: true
          pnpm: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt,clippy
          rustflags: ''

      - uses: taiki-e/install-action@cargo-hack

      - name: Check Cargo.lock is up to date
        run: |
          if ! cargo metadata --format-version 1 --locked --no-deps > /dev/null; then
            echo "::error::Cargo.lock is out of date. Run cargo generate-lockfile or cargo build locally, then commit Cargo.lock."
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check Clippy
        run: cargo clippy --all-targets --features full --all -- -D warnings

      - name: Check features
        if: ${{ !cancelled() }}
        run: cargo hack check --package exvlan --each-feature --exclude-features macos-ne --verbose

  pre-test:
    name: Build test
    runs-on: ubuntu-latest
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          gui: true
          pnpm: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@nextest

      - name: Archive test
        run: cargo nextest archive --archive-file tests.tar.zst --package exvlan --features full

      - uses: actions/upload-artifact@v7
        with:
          name: tests
          path: tests.tar.zst
          retention-days: 1

  test_matrix:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [ pre_job, pre-test ]
    if: needs.pre_job.outputs.should_skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "exvlan"
            opts: "-E 'not test(tests::three_node)' --test-threads 1 --no-fail-fast"

          - name: "three_node"
            opts: "-E 'test(tests::three_node) and not test(subnet_proxy_three_node_test)' --test-threads 1 --no-fail-fast"

          - name: "three_node::subnet_proxy_three_node_test"
            opts: "-E 'test(subnet_proxy_three_node_test)' --test-threads 1 --no-fail-fast"
    steps:
      - uses: actions/checkout@v6

      - name: Setup DNS for test domains
        run: |
          # Add test domains to /etc/hosts for DNS resolution
          # Note: Replace these IPs with actual STUN server IPs if available
          echo "127.0.0.1 test.xvlan.era-x.cn" | sudo tee -a /etc/hosts
          echo "::1 test.xvlan.era-x.cn" | sudo tee -a /etc/hosts
          echo "127.0.0.1 github-ci-test.xvlan.era-x.cn" | sudo tee -a /etc/hosts
          echo "::1 github-ci-test.xvlan.era-x.cn" | sudo tee -a /etc/hosts
          echo "127.0.0.1 txt.xvlan.era-x.cn" | sudo tee -a /etc/hosts
          echo "::1 txt.xvlan.era-x.cn" | sudo tee -a /etc/hosts
          echo "127.0.0.1 txt.stun.xvlan.era-x.cn" | sudo tee -a /etc/hosts
          echo "::1 txt.stun.xvlan.era-x.cn" | sudo tee -a /etc/hosts
          echo "127.0.0.1 txt.stun-v6.xvlan.era-x.cn" | sudo tee -a /etc/hosts
          echo "::1 txt.stun-v6.xvlan.era-x.cn" | sudo tee -a /etc/hosts

      - name: Setup tools for test
        run: sudo apt install bridge-utils

      - name: Setup system for test
        run: |
          sudo modprobe br_netfilter
          sudo sysctl net.bridge.bridge-nf-call-iptables=0
          sudo sysctl net.bridge.bridge-nf-call-ip6tables=0
          sudo sysctl net.ipv6.conf.lo.disable_ipv6=0
          sudo ip addr add 2001:db8::2/64 dev lo

      - uses: taiki-e/install-action@nextest

      - name: Download tests
        uses: actions/download-artifact@v8
        with:
          name: tests

      - name: Run tests
        run: |
          sudo prlimit --pid $$ --nofile=1048576:1048576
          sudo -E env "PATH=$PATH" cargo nextest run --archive-file tests.tar.zst ${{ matrix.opts }}

  test:
    name: Test Result Check
    runs-on: ubuntu-latest
    needs: [ pre_job, check, test_matrix ]
    if: needs.pre_job.result == 'success' && needs.pre_job.outputs.should_skip != 'true' && !cancelled()
    steps:
      - name: Mark result as failed
        if: contains(needs.*.result, 'failure')
        run: exit 1
