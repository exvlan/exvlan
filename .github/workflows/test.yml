name: Exvlan Test

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
#  RUSTC_WRAPPER: "sccache"
#  SCCACHE_GHA_ENABLED: "true"

defaults:
  run:
    # necessary for windows
    shell: bash

jobs:
  pre_job:
    runs-on: ubuntu-latest
    env:
      RELEVANT_PATHS: >-
        ["Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".cargo/**",
        "pnpm-lock.yaml", "pnpm-workspace.yaml", "package.json", "exvlan/**",
        "exvlan/core/**", "exvlan/proto/**", "exvlan/proto/build/**",
        "exvlan/api/**", "packages/studio/src-tauri/**",
        "tauri-plugin-vpnservice/**", "exvlan/contrib/**",
        ".github/workflows/test.yml", ".github/actions/**"]
    outputs:
      # 仅 PR 按路径门控跳过；push/tag/dispatch 一律构建（pipeline 已统一门控，
      # 不再用 skip-duplicate 因内容重复而跳过）。
      should_skip: >-
        ${{
          github.event_name == 'pull_request' &&
          steps.path_filter.outputs.relevant != 'true'
        }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5
        with:
          concurrent_skipping: "never"
          skip_after_successful_duplicate: "true"
          paths: ${{ env.RELEVANT_PATHS }}

      - id: path_filter
        if: >-
          github.event_name == 'pull_request' &&
          steps.skip_check.outputs.should_skip != 'true'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            relevant: ${{ env.RELEVANT_PATHS }}

  check:
    name: Run linters & check
    runs-on: ubuntu-latest
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          gui: true
          pnpm: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          components: rustfmt,clippy
          target: wasm32-wasip1
          rustflags: ""

      - uses: taiki-e/install-action@d8a3af99c9218844a5b609a03d73ecfb4fdee649 # cargo-hack

      - name: Check formatting
        if: ${{ !cancelled() }}
        run: cargo fmt --all -- --check

      - name: Check Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets --features full --all -- -D warnings

      - name: Check features
        if: ${{ !cancelled() }}
        run: cargo hack check --package exvlan --each-feature --exclude-features macos-ne --verbose

      - name: Check WASI
        if: ${{ !cancelled() }}
        run: >-
          cargo check --package exvlan-core --lib --target wasm32-wasip1
          --features management-rpc,proxy-smoltcp-stack,ring-crypto,wasi-crypto-offload

      - name: Check Cargo.lock is up to date
        if: ${{ !cancelled() }}
        run: |
          if ! cargo metadata --format-version 1 --locked > /dev/null; then
            echo "::error::Cargo.lock is out of date. Run cargo generate-lockfile or cargo build locally, then commit Cargo.lock."
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          gui: true
          pnpm: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Setup tools for test
        run: sudo apt install bridge-utils

      - name: Setup upnpd for test
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y miniupnpd miniupnpd-iptables iptables

      - name: Setup system for test
        run: |
          sudo modprobe br_netfilter
          sudo modprobe tun
          if [ ! -e /dev/net/tun ]; then
            sudo mkdir -p /dev/net
            sudo mknod /dev/net/tun c 10 200
          fi
          sudo sysctl net.bridge.bridge-nf-call-iptables=0
          sudo sysctl net.bridge.bridge-nf-call-ip6tables=0
          sudo sysctl net.ipv6.conf.lo.disable_ipv6=0
          sudo ip addr add 2001:db8::2/64 dev lo

      - uses: taiki-e/install-action@2eb6de229bc778f7df20e106e4b34e9a364c73e6 # nextest

      - name: Run tests
        run: |
          sudo prlimit --pid $$ --nofile=1048576:1048576
          sudo -E env "PATH=$PATH" EXVLAN_LINUX_BPF_INTEGRATION=required \
            cargo nextest run --package exvlan --package exvlan-core --features full \
            --test-threads 1 --no-fail-fast
