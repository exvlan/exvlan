name: Exvlan Test

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
#  RUSTC_WRAPPER: "sccache"
#  SCCACHE_GHA_ENABLED: "true"

defaults:
  run:
    # necessary for windows
    shell: bash

jobs:
  pre_job:
    runs-on: ubuntu-latest
    env:
      RELEVANT_PATHS: >-
        ["Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".cargo/**",
        "pnpm-lock.yaml", "pnpm-workspace.yaml", "package.json", "exvlan/**",
        "exvlan/core/**", "exvlan/proto/**", "exvlan/proto/build/**",
        "exvlan/api/**", "packages/studio/src-tauri/**",
        "tauri-plugin-vpnservice/**", "exvlan/contrib/**",
        ".github/workflows/test.yml", ".github/actions/**"]
    outputs:
      # 仅 PR 按路径门控跳过；push/tag/dispatch 一律构建（pipeline 已统一门控，
      # 不再用 skip-duplicate 因内容重复而跳过）。
      should_skip: >-
        ${{
          github.event_name == 'pull_request' &&
          steps.path_filter.outputs.relevant != 'true'
        }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5
        with:
          concurrent_skipping: "never"
          skip_after_successful_duplicate: "true"
          paths: ${{ env.RELEVANT_PATHS }}

      - id: path_filter
        if: >-
          github.event_name == 'pull_request' &&
          steps.skip_check.outputs.should_skip != 'true'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            relevant: ${{ env.RELEVANT_PATHS }}

  check:
    name: Run linters & check
    runs-on: ubuntu-latest
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # 路径守卫：绝对路径字面量只允许出现在 paths.rs（见 docs/paths.md）
      - name: Check path literals
        run: bash script/ci/check-paths.sh

      # 打包守卫：平台覆盖文件不能丢掉基础配置的 bundle.resources
      # （pre.13 事故：tauri.windows.conf.json 整体替换后没有 resources/service/*，
      #   Windows 安装包里根本没有 exvlan-service.exe → 安装必失败）
      - name: Check tauri bundle resources
        run: python3 script/ci/check-tauri-resources.py

      # i18n 守卫：字面量 `t("a.b")` 必须在 cn/en 语言包里存在。
      # pre.14 事故：`settings.privileged_service` 被放进 `web.settings`
      # （层级错一层），yaml 合法、tsc 通过，界面上直接把 key 渲染出来。
      - name: Check i18n keys
        run: python3 script/ci/check-i18n-keys.py

      # runner 预装内容 + 全 feature 构建很容易打满磁盘（曾多次 No space left on device）
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/local/lib/node_modules /opt/az \
                      /usr/local/lib/android /usr/share/swift /usr/local/.ghcup \
                      /opt/microsoft /usr/local/share/chromium /usr/lib/firefox \
                      /usr/share/miniconda /usr/lib/mono /usr/local/share/powershell \
                      /usr/local/go /usr/share/az_* /opt/hostedtoolcache/PyPy || true
          df -h /

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          gui: true
          pnpm: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          components: rustfmt,clippy
          target: wasm32-wasip1
          rustflags: ""

      - uses: taiki-e/install-action@d8a3af99c9218844a5b609a03d73ecfb4fdee649 # cargo-hack

      - name: Check formatting
        if: ${{ !cancelled() }}
        run: cargo fmt --all -- --check

      - name: Check Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets --features full --all -- -D warnings

      - name: Check features
        if: ${{ !cancelled() }}
        run: cargo hack check --package exvlan --each-feature --exclude-features macos-ne --verbose

      - name: Check WASI
        if: ${{ !cancelled() }}
        run: >-
          cargo check --package exvlan-core --lib --target wasm32-wasip1
          --features management-rpc,proxy-smoltcp-stack,ring-crypto,wasi-crypto-offload

      - name: Check Cargo.lock is up to date
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          # 保留 stderr：registry 瞬时不可用时能看到真实原因（历史上有过 stderr 为空却 exit 1 的情况）。
          for i in 1 2 3; do
            if cargo metadata --format-version 1 --locked > /dev/null; then
              echo "Cargo.lock OK"
              exit 0
            fi
            echo "::warning::cargo metadata --locked 失败（第 ${i} 次），10s 后重试"
            sleep 10
          done
          echo "::error::Cargo.lock is out of date（或 registry 不可用）。本地执行 cargo generate-lockfile 后提交 Cargo.lock。"
          exit 1

  test:
    name: Test (${{ matrix.package }})
    runs-on: ubuntu-latest
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    strategy:
      # 两个包的 --features full 测试产物都很大，分开跑避免单个 runner 磁盘耗尽
      fail-fast: false
      matrix:
        include:
          # exvlan-core 没有 full feature，只有 exvlan 需要
          - package: exvlan
            args: "--features full"
          - package: exvlan-core
            args: ""
          # FFI 是移动端唯一 RPC 通道：管理面分发、panic 兜底、超时都在这里验证
          - package: exvlan-ffi
            args: ""
    env:
      # 全 feature 的 debug 产物带调试信息会撑爆 runner 磁盘；测试不需要
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          gui: true
          pnpm: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Setup tools for test
        run: sudo apt install bridge-utils

      - name: Setup upnpd for test
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y miniupnpd miniupnpd-iptables iptables

      - name: Setup system for test
        run: |
          sudo modprobe br_netfilter
          sudo modprobe tun
          if [ ! -e /dev/net/tun ]; then
            sudo mkdir -p /dev/net
            sudo mknod /dev/net/tun c 10 200
          fi
          sudo sysctl net.bridge.bridge-nf-call-iptables=0
          sudo sysctl net.bridge.bridge-nf-call-ip6tables=0
          sudo sysctl net.ipv6.conf.lo.disable_ipv6=0
          sudo ip addr add 2001:db8::2/64 dev lo

      - uses: taiki-e/install-action@2eb6de229bc778f7df20e106e4b34e9a364c73e6 # nextest

      - name: Run tests
        run: |
          sudo prlimit --pid $$ --nofile=1048576:1048576
          # 注意：`sudo -E env "PATH=..." VAR=...` 会重建环境，job 级 env 不会被继承，
          # 必须在这里显式带上（否则 debug info 仍会打满磁盘）。
          sudo -E env "PATH=$PATH" \
            EXVLAN_LINUX_BPF_INTEGRATION=required \
            CARGO_PROFILE_DEV_DEBUG=0 CARGO_PROFILE_TEST_DEBUG=0 CARGO_INCREMENTAL=0 \
            cargo nextest run --package ${{ matrix.package }} ${{ matrix.args }} \
            --test-threads 1 --no-fail-fast --retries 2
