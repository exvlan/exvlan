name: EXVlan Test

on:
  workflow_call:
  workflow_dispatch:
    # push:
    #   branches: [ "develop", "feature", "main", "feature/*", "releases/**" ]
    #   paths: &path_filter
    #     - "Cargo.toml"
    #     - "Cargo.lock"
    #     - "exvlan/core/**"
    #     - ".github/workflows/test.yml"
    #     - ".github/actions/**"
    # pull_request:
    #   branches: [ "develop", "main" ]
    #   paths: *path_filter

permissions:
  contents: read
  actions: write

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Run linters & check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          gui: true
          pnpm: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install GLib system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -qq libglib2.0-dev

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt,clippy
          rustflags: ''

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ''
          shared-key: 'exvlan-shared'
          cache-targets: true

      - name: Install cargo-hack
        uses: taiki-e/install-action@v2.85.11
        with:
          tool: cargo-hack

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check Clippy
        run: cargo clippy --all-targets --features full --all -- -D warnings

      - name: Check features
        run: cargo hack check --package exvlan --each-feature --exclude-features
          macos-ne --verbose

      - name: Check Cargo.lock is up to date
        run: |
          if ! cargo metadata --format-version 1 --locked > /dev/null; then
            echo "::error::Cargo.lock is out of date. Run cargo generate-lockfile or cargo build locally, then commit Cargo.lock."
            exit 1
          fi

  pre-test:
    name: Build test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          gui: true
          pnpm: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: 'exvlan-shared'

      - uses: taiki-e/install-action@nextest
        with:
          tool: nextest

      - name: Archive test
        run: cargo nextest archive --archive-file tests.tar.zst --package exvlan
          --features full

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: tests
          path: tests.tar.zst
          retention-days: 1

  test_matrix:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: pre-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "exvlan"
            opts: "-E 'not test(tests::three_node)' --test-threads 1 --no-fail-fast"
          - name: "three_node"
            opts: "-E 'test(tests::three_node) and not test(subnet_proxy_three_node_test)'
              --test-threads 1 --no-fail-fast"
          - name: "three_node::subnet_proxy_three_node_test"
            opts: "-E 'test(subnet_proxy_three_node_test)' --test-threads 1 --no-fail-fast"
    steps:
      - uses: actions/checkout@v7

      - name: Setup DNS for test domains
        run: |
          # Add test domains to /etc/hosts for DNS resolution
          # Note: Replace these IPs with actual STUN server IPs if available
          echo "127.0.0.1 test.xvlan.era-x.cn" | sudo tee -a /etc/hosts
          echo "::1 test.xvlan.era-x.cn" | sudo tee -a /etc/hosts
          echo "127.0.0.1 github-ci-test.xvlan.era-x.cn" | sudo tee -a /etc/hosts
          echo "::1 github-ci-test.xvlan.era-x.cn" | sudo tee -a /etc/hosts
          echo "127.0.0.1 txt.xvlan.era-x.cn" | sudo tee -a /etc/hosts
          echo "::1 txt.xvlan.era-x.cn" | sudo tee -a /etc/hosts
          echo "127.0.0.1 txt.stun.xvlan.era-x.cn" | sudo tee -a /etc/hosts
          echo "::1 txt.stun.xvlan.era-x.cn" | sudo tee -a /etc/hosts
          echo "127.0.0.1 txt.stun-v6.xvlan.era-x.cn" | sudo tee -a /etc/hosts
          echo "::1 txt.stun-v6.xvlan.era-x.cn" | sudo tee -a /etc/hosts

      - name: Setup tools for test
        run: sudo apt install bridge-utils
      - name: Setup upnpd for test
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y miniupnpd miniupnpd-iptables iptables

      - name: Setup system for test
        run: |
          sudo modprobe br_netfilter
          sudo sysctl net.bridge.bridge-nf-call-iptables=0
          sudo sysctl net.bridge.bridge-nf-call-ip6tables=0
          sudo sysctl net.ipv6.conf.lo.disable_ipv6=0
          sudo ip addr add 2001:db8::2/64 dev lo

      - uses: taiki-e/install-action@v2.85.11
        with:
          tool: nextest
      - name: Download tests
        uses: actions/download-artifact@v8
        with:
          name: tests

      - name: Run tests
        run: |
          sudo prlimit --pid $$ --nofile=1048576:1048576
          sudo -E env "PATH=$PATH" cargo nextest run --archive-file tests.tar.zst ${{ matrix.opts }}
