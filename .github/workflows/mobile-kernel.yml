name: Mobile Kernel Libs

# 为移动端（Android 各 ABI / iOS）构建**预编译内核库**，供 app 直接打包，
# 从而让 studio 的移动构建不再编译整颗内核。
#
# 产物：mobile-kernel-<abi>（libexvlan_ffi.so / libexvlan.a）

on:
  workflow_call:
    inputs:
      abis:
        description: 'Android ABIs (JSON array or "all")'
        type: string
        default: 'all'
  workflow_dispatch:
    inputs:
      abis:
        description: 'Android ABIs (JSON array or "all")'
        default: 'all'

permissions:
  contents: read

concurrency:
  group: mobile-kernel-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Prepare matrix
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.gen.outputs.include }}
    steps:
      - name: Generate matrix
        id: gen
        run: |
          python3 - '${{ inputs.abis }}' <<'PY'
          import json, os, sys

          ALL = [
              {"ABI": "arm64-v8a",   "TARGET": "aarch64-linux-android"},
              {"ABI": "armeabi-v7a", "TARGET": "armv7-linux-androideabi"},
              {"ABI": "x86",         "TARGET": "i686-linux-android"},
              {"ABI": "x86_64",      "TARGET": "x86_64-linux-android"},
          ]
          sel = sys.argv[1] if len(sys.argv) > 1 else "all"
          if sel in ("", "all"):
              result = ALL
          else:
              wanted = set(json.loads(sel))
              result = [e for e in ALL if e["ABI"] in wanted]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("include=" + json.dumps(result) + "\n")
          print(json.dumps(result))
          PY

  build:
    name: build (${{ matrix.ABI }})
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.include) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: 14742923
          packages: "ndk;26.0.10792818 platform-tools"

      - name: Setup Android environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.0.10792818" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/ndk/26.0.10792818/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          toolchain: 1.95
          target: ${{ matrix.TARGET }}
          rustflags: ""

      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-ndk

      - uses: ./.github/actions/setup-protoc
        with:
          version: '35.1'
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: mobile-kernel
          shared-key: "mobile-kernel"
          cache-targets: "false"

      # 只编内核的 C-ABI 库（exvlan-ffi），不涉及 studio。
      - name: Build kernel FFI library
        run: |
          set -euo pipefail
          cargo ndk -t "${{ matrix.TARGET }}" -o ./jni-out \
            build --release -p exvlan-ffi
          ls -lR ./jni-out

      - name: Collect artifact
        run: |
          set -euo pipefail
          mkdir -p ./artifacts
          find ./jni-out -name '*.so' -exec cp {} ./artifacts/ \;
          ls -l ./artifacts/

      - name: Upload mobile kernel artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mobile-kernel-${{ matrix.ABI }}
          path: ./artifacts
          if-no-files-found: error
          retention-days: 14

  result:
    name: mobile-kernel-result
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Aggregate
        run: |
          echo "result: ${{ needs.build.result }}"
          [ "${{ needs.build.result }}" = "success" ]
