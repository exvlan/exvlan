name: Builder & Publish Pipeline

on:
  push:
    branches: ["develop", "feature", "main"]
    tags: ["v*"]

  pull_request:
    branches: ["develop", "main"]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "flake.lock"
      - "**/*.nix"
      - "exvlan/**"
      - ".github/workflows/*.yml"
      - ".github/actions/**"
      - "packages/**"

  workflow_dispatch:
    inputs:
      publish:
        description: "Publish ohos HAR and dispatch downstream"
        type: boolean
        default: false
        required: false
      nightly:
        description: "跑一次 nightly 链路（等价 21:00 UTC 定时）"
        type: boolean
        default: false
        required: false

  # schedule 是唯一「没有 push 也会跑」的入口，两条 cron 各管一件事：
  #   · 每周一 03:00 UTC：只跑依赖审计（新 advisory 与代码无关，不能等 push 才发现）；
  #   · 每天 21:00 UTC（= 北京 05:00）：nightly 构建，产出可自更新的预览包。
  # 两者的门控靠 `changes` 作业的 `nightly` 布尔区分（见 jobs.changes）。
  # nightly 也能手动触发：workflow_dispatch 勾选 `nightly`（等价 21:00 UTC 那条 cron）。
  schedule:
    - cron: "0 3 * * 1"
    - cron: "0 21 * * *"

permissions:
  contents: write
  actions: write
  packages: write
  pull-requests: read
  issues: write

concurrency:
  # 按 commit sha 去重：同一提交同时被分支与 tag 命中时（先推 develop 再推 tag），
  # 后触发的 tag 运行会取消分支运行，只保留一轮全链（含 release）。
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  # 统一编排入口：所有组件都经此依赖链调用，组件工作流不再各自触发。
  # 门控策略（`nightly` = 21:00 UTC 的 cron **或** dispatch 勾选 `nightly`，两者完全等价）：
  #   - feature push / PR(develop,main)：仅 tests + core（轻量）；audit 按依赖路径门控（PR 全量）
  #   - develop/main push：core 链必跑；go/js/nix/ohos 按路径门控；audit 按依赖路径门控
  #   - tag v*：全量（旁路绕过路径门控）+ release(tag) + audit（全量）
  #   - workflow_dispatch(nightly=false)：全量，同 tag（除 release）
  #   - workflow_dispatch(nightly=true)：只跑 nightly 链，等价 21:00 UTC cron
  #   - schedule(nightly, 21:00 UTC)：只跑 nightly 链（core 6 平台 → studio/mobile → nightly release）
  #   - schedule(每周一审计, 03:00 UTC)：只跑 audit + upstream_watch
  # 下游一律用 `needs.changes.outputs.nightly` 判断；只有 `tests` / `nightly_notify`
  # 因为不 `needs: changes`（要尽早启动 / 要在 changes 失败时也能报警）而直接读 `inputs.nightly`。
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      js: ${{ steps.filter.outputs.js }}
      nix: ${{ steps.filter.outputs.nix }}
      ohos: ${{ steps.filter.outputs.ohos }}
      deps: ${{ steps.filter.outputs.deps }}
      core: ${{ steps.filter.outputs.core }}
      nightly: ${{ steps.gate.outputs.nightly }}
      nightly_version: ${{ steps.gate.outputs.nightly_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # nightly 门控布尔：唯一入口。两个入口等价：
      #   · `github.event.schedule == '0 21 * * *'`（只在 schedule 事件里存在，其它事件为空串）；
      #   · `workflow_dispatch` 勾选 `nightly`（布尔输入，经 env 传进 shell 后是 "true"/"false"，
      #     这里兼容 "1"/"yes"/"on" 这类手工/API 传参）。
      # 版本串也在这里算一次（跨年守卫会直接失败），全 run 共用一份，避免各作业各算一份。
      - name: Resolve nightly gate and version
        id: gate
        env:
          NIGHTLY_INPUT: ${{ inputs.nightly }}
        run: |
          set -euo pipefail
          is_nightly=false
          case "${NIGHTLY_INPUT:-false}" in
            [Tt][Rr][Uu][Ee]|1|[Yy][Ee][Ss]|[Oo][Nn]) is_nightly=true ;;
          esac
          if [[ "${{ github.event_name }}" == "schedule" && "${{ github.event.schedule }}" == "0 21 * * *" ]]; then
            is_nightly=true
          fi
          if [[ "$is_nightly" == "true" ]]; then
            echo "nightly=true" >>"$GITHUB_OUTPUT"
            version=$(bash script/ci/nightly-version.sh)
            echo "nightly_version=${version}" >>"$GITHUB_OUTPUT"
            echo "nightly version: ${version}"
          else
            echo "nightly=false" >>"$GITHUB_OUTPUT"
          fi
      - id: filter
        if: github.event_name == 'push' && github.ref_type != 'tag'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            go:
              - 'exvlan/go/**'
              - '.github/workflows/go.yml'
            js:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'exvlan/core/**'
              - 'exvlan/proto/**'
              - 'packages/sdk/**'
              - '.github/workflows/js.yml'
            nix:
              - '**/*.nix'
              - 'flake.lock'
              - 'rust-toolchain.toml'
            ohos:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - 'exvlan/**'
              - '.github/workflows/ohos.yml'
              - '.github/actions/**'
            deps:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '**/package.json'
              - '**/pnpm-lock.yaml'
              - '**/go.mod'
              - '**/go.sum'
              - '.cargo/audit.toml'
              - '.github/workflows/audit.yml'
            # 内核二进制是否可能变化。纯 packages/studio（前端/服务）改动
            # 命中不了这里 → 非 tag 的 develop push 可以跳过 12 个内核 target。
            core:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - 'exvlan/**'
              - 'packages/ui/**'
              - 'packages/std/**'
              - '.github/workflows/core.yml'
              - '.github/actions/**'

  tests:
    name: Core Tests
    # nightly（21:00 cron 与手动 dispatch nightly=true）不跑测试：两者链路完全等价。
    # 这里直接读 `inputs.nightly`（不 `needs: changes`，避免测试被 changes 拖慢/连带失败）；
    # `contains(fromJSON(...))` 同时兼容布尔 true 与字符串 "true"/"1"。
    if: >-
      github.event_name != 'schedule' &&
      !(github.event_name == 'workflow_dispatch' &&
        contains(fromJSON('["true", true, "1", 1]'), inputs.nightly))
    uses: ./.github/workflows/test.yml
    secrets: inherit

  # Web 控制台产物：`exvlan-api --features=embed` 会把 packages/ui/dist 编进二进制。
  # 单独构建一次供 15 个 core 平台复用，避免每个作业都装 pnpm/wasm-pack
  # （历史上 pnpm 的 wasm-pack → binaryen 下载失败过多次，直接打挂发版）。
  web_dist:
    name: Build Web Console
    needs: changes
    # nightly（cron 或 dispatch 勾选）也要 web-dist：内核 `--features=embed` 会把它编进二进制。
    if: needs.changes.outputs.nightly == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Bun 统一安装入口（当前没有任何步骤依赖它）：后续把 `script/ci` 的 Python 脚本、
      # 镜像/清单重写迁到 Bun/TS 时，把这两步复制到需要的作业即可。
      # 硬约束：`continue-on-error` 不可去掉 —— 安装失败只能让「将来用 bun 的步骤」不可用，
      # 不能把现有构建打红（web_dist 是 core/release 的前置，红了会拖死整条链）。
      # 缓存两层：setup-bun 自缓存可执行文件；下面再缓存包安装目录 `~/.bun/install/cache`。
      - name: Setup Bun (optional)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        continue-on-error: true
        with:
          bun-version: latest

      - name: Cache Bun install cache (optional)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        continue-on-error: true
        with:
          path: ~/.bun/install/cache
          # 目前仓库里还没有 bun.lock（仍是 pnpm）；key 里带上 package.json，
          # 等切到 bun 后 hash 会自动跟随 lockfile。
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Prepare pnpm environment
        uses: ./.github/actions/prepare-pnpm
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          build-filter: "./packages/ui... ./packages/generator..."

      # 注意：prepare-pnpm 的最后一步已把 generator/dist 复制进
      # ui/dist/config-generator，所以只需要上传 ui/dist 一个目录
      # （单一路径的 artifact 根就是 dist 本身，下游复制路径才可预测）。
      - name: Upload web console dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-dist
          path: packages/ui/dist
          if-no-files-found: error
          retention-days: 3

  # Web 控制台静态镜像（Cloudflare Pages）。`console.xvlan.era-x.cn` 由 Caddy 反代
  # exvlan-api 提供（主入口）；这里只维护 `ui.console.xvlan.era-x.cn` 的静态副本。
  pages:
    name: Deploy Web Console (Pages)
    needs: [changes, web_dist]
    if: >-
      github.event_name != 'pull_request' && github.event_name != 'schedule' &&
      needs.changes.outputs.nightly != 'true' &&
      needs.web_dist.result == 'success' &&
      (github.ref_type == 'tag' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web-dist
          path: ./web-dist

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 8538ebeec9a79fac1169610553c1422e
        run: |
          set -euo pipefail
          # --branch main 表示生产部署（Pages 生产分支为 main）
          npx --yes wrangler@4 pages deploy ./web-dist \
            --project-name era-xvlan-ui \
            --branch main \
            --commit-dirty=true

  # 桌面内核单独一个作业：GUI 矩阵只消费这两个 target。
  # 拆开后 studio 不必等 12 个无关 target（含最慢的 macos-aarch64，实测 45m）。
  # 只会在真正构建 GUI 的场景跑（develop/main push、tag、dispatch）。
  core_desktop:
    name: Build Core (desktop)
    needs: [changes, web_dist]
    if: >-
      github.event_name != 'schedule' && github.event_name != 'pull_request' &&
      needs.changes.outputs.nightly != 'true' &&
      github.ref_name != 'feature' &&
      (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' ||
       needs.changes.outputs.core == 'true')
    uses: ./.github/workflows/core.yml
    with:
      targets: '["x86_64-apple-darwin","x86_64-pc-windows-msvc"]'
      build_magisk: false
      # 必须与下面 core 的 variant 不同：否则同一 run 内两次调用会互相取消
      variant: desktop
    secrets: inherit

  core:
    name: Build Core
    # 不再等 tests：core 构建不消费测试结果；tests 仍作为 release 的门禁。
    # 这里只建非桌面 target（桌面两个在 core_desktop），避免重复构建；
    # magisk 依赖 linux-aarch64，所以留在本作业。
    needs: [changes, web_dist]
    # tag / dispatch 必须全量（release 要用全部内核资产）；develop/main push
    # 只在真的改了内核相关路径时才建这 12 个 target。
    # nightly（cron 或 dispatch 勾选）只建镜像托管的 6 个平台：桌面 GUI 只用到其中的
    # mac x86_64/aarch64 与 win x86_64，其余 3 个 Linux/arm 平台给内核镜像用。
    if: >-
      needs.changes.outputs.nightly == 'true' ||
      (github.event_name != 'schedule' &&
       (github.event_name == 'pull_request' || github.ref_type == 'tag' ||
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.core == 'true'))
    uses: ./.github/workflows/core.yml
    with:
      targets: >-
        ${{ needs.changes.outputs.nightly == 'true'
            && '["x86_64-apple-darwin","aarch64-apple-darwin","x86_64-pc-windows-msvc","aarch64-pc-windows-msvc","x86_64-unknown-linux-musl","aarch64-unknown-linux-musl"]'
            || (github.ref_name == 'feature'
                && '["x86_64-unknown-linux-musl"]'
                || '["x86_64-unknown-linux-musl","aarch64-unknown-linux-musl","riscv64gc-unknown-linux-musl","loongarch64-unknown-linux-musl","armv7-unknown-linux-musleabihf","armv7-unknown-linux-musleabi","arm-unknown-linux-musleabihf","arm-unknown-linux-musleabi","x86_64-unknown-freebsd","aarch64-apple-darwin","i686-pc-windows-msvc","aarch64-pc-windows-msvc"]') }}
      build_magisk: ${{ needs.changes.outputs.nightly != 'true' && github.ref_name != 'feature' }}
      # nightly 用独立 variant：避免与 core_desktop / 同 ref 的其它调用互相取消
      variant: ${{ needs.changes.outputs.nightly == 'true' && 'nightly' || 'main' }}
      build_version: ${{ needs.changes.outputs.nightly_version }}
    secrets: inherit

  # 旁路组件：develop/main push 按路径门控；tag/dispatch 全量；feature/PR 跳过；nightly 跳过。
  go:
    name: Go Tests
    needs: changes
    if: >-
      github.event_name != 'pull_request' && github.ref_name != 'feature' &&
      needs.changes.outputs.nightly != 'true' &&
      (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true')
    uses: ./.github/workflows/go.yml
    secrets: inherit

  js:
    name: JavaScript Hosts
    needs: changes
    if: >-
      github.event_name != 'pull_request' && github.ref_name != 'feature' &&
      needs.changes.outputs.nightly != 'true' &&
      (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.js == 'true')
    uses: ./.github/workflows/js.yml
    secrets: inherit

  nix:
    name: Nix Check
    needs: changes
    if: >-
      github.event_name != 'pull_request' && github.ref_name != 'feature' &&
      needs.changes.outputs.nightly != 'true' &&
      (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.nix == 'true')
    uses: ./.github/workflows/nix.yml
    secrets: inherit

  # 依赖审计门禁：tag 全量；非 nightly 的 dispatch 全量；PR 全量；push 按 manifest/lock 路径门控（含 feature）。
  # schedule 只在每周一审计那条 cron 上跑，nightly 那条不跑（省额度、也避免审计红把 nightly 拖下水）。
  audit:
    name: Dependency Audit
    needs: changes
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'schedule' && needs.changes.outputs.nightly != 'true') ||
      github.ref_type == 'tag' ||
      (github.event_name == 'workflow_dispatch' && needs.changes.outputs.nightly != 'true') ||
      needs.changes.outputs.deps == 'true'
    uses: ./.github/workflows/audit.yml
    secrets: inherit

  # 上游监控（仅每周一那条 schedule）：对比 EasyTier/EasyTier 最新 release 与本地已同步的 v2.* tag。
  upstream_watch:
    name: Upstream Watch
    if: github.event_name == 'schedule' && github.event.schedule != '0 21 * * *'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check upstream releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 不能用 releases/latest：该端点只返回非 prerelease。上游 EasyTier 的稳定 channel
          # 长期停在 v2.6.4，实际迭代都发在 prerelease（v2.7.0 / nightly），用 latest 会永远漏报。
          # 这里取全部 release（排除 draft 与 nightly 这类滚动 tag），按语义版本取最大。
          latest=$(gh api "repos/EasyTier/EasyTier/releases?per_page=100" --paginate \
            --jq '.[] | select(.draft == false) | .tag_name' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -uV | tail -n1 || true)
          # 已同步版本以仓库内唯一事实源为准（不再依赖 fork 上的 v2.* tag：
          # 上游 tag 未推送到本仓，之前 `synced` 恒为空 → 该 watch 实际从未生效）。
          synced=$(grep -E '^version:' docs/rules/workflow/upstream-path-map.yaml 2>/dev/null \
            | head -n1 | awk '{print $2}' | tr -d '"' || true)
          echo "upstream=${latest:-none} synced=${synced:-none}"
          if [ -z "${latest:-}" ]; then echo "no upstream release tag, skip"; exit 0; fi
          if [ -z "${synced:-}" ]; then echo "no synced version in upstream-path-map.yaml, skip"; exit 0; fi
          newest=$(printf '%s\n%s\n' "$synced" "$latest" | sort -V | tail -n1)
          if [ "$newest" = "$latest" ] && [ "$latest" != "$synced" ]; then
            existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 200 --json title \
              | jq --arg t "$latest" '[.[] | select(.title | contains($t))] | length')
            if [ "${existing:-1}" = "0" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" \
                --title "upstream: 新 release $latest 待同步" \
                --body "$(printf '检测到上游 `EasyTier/EasyTier` 发布了 **%s**，本地已同步到 **%s**。\n\n按 `.agents/skills/upstream-fork-sync` 流程同步：`upstream/releases/%s` → `feature` → 压缩进 `develop`。' "$latest" "$synced" "$latest")"
            else
              echo "open issue already exists for $latest, skip"
            fi
          else
            echo "already synced to $synced"
          fi

  ohos:
    name: OpenHarmony
    needs: [core, changes]
    if: >-
      github.event_name != 'pull_request' && github.ref_name != 'feature' &&
      needs.changes.outputs.nightly != 'true' &&
      (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.ohos == 'true')
    uses: ./.github/workflows/ohos.yml
    with:
      publish: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    secrets: inherit

  studio:
    name: Build Studio GUI
    # 正常路径只等桌面内核（GUI 矩阵只下载 core-macos-*/core-windows-*）；
    # nightly 的内核来自 `core`（6 平台里含桌面两个），因此两处都要在 needs 里。
    needs: [changes, core_desktop, core]
    # `always()` 是必须的：`core_desktop` 被路径门控**跳过**时，GitHub 默认会把
    # 依赖它的作业一并跳过 —— 那样「只改 GUI」的提交永远不会编译 GUI，
    # 直到打 tag 才第一次发现编译错误。
    if: >-
      always() &&
      github.ref_name != 'feature' &&
      (
        (needs.changes.outputs.nightly == 'true' && needs.core.result == 'success') ||
        (needs.changes.outputs.nightly != 'true' && github.event_name != 'schedule' &&
         github.event_name != 'pull_request' &&
         (needs.core_desktop.result == 'success' || needs.core_desktop.result == 'skipped'))
      )
    uses: ./.github/workflows/studio.yml
    with:
      # nightly 只出「最小自更新集」：macOS x86_64 + aarch64、Windows x86_64。
      # 正式发版仍传 all（产物集不变）。
      targets: ${{ needs.changes.outputs.nightly == 'true' && '["x86_64-apple-darwin","aarch64-apple-darwin","x86_64-pc-windows-msvc"]' || 'all' }}
      # core_desktop 被路径门控跳过时，studio 从最近一次成功的 pipeline 运行
      # 取桌面内核产物（内核没变，没必要重建）。nightly 的内核就在本 run 里。
      kernel_from_previous: ${{ needs.changes.outputs.nightly != 'true' && needs.core_desktop.result == 'skipped' && 'true' || 'false' }}
      build_version: ${{ needs.changes.outputs.nightly_version }}
    secrets: inherit

  mobile:
    name: Build Studio Mobile
    # 移动端只用 mobile-kernel-* 产物，不需要等内核作业。
    # 但**必须**等 `mobile_kernel` 产出：加 `always()` 后本作业会在 pipeline 一开始
    # 就启动，与 mobile-kernel 并行 → 下载 artifact 时它还不在（实测直接失败）。
    needs: [changes, core_desktop, mobile_kernel]
    # 同上：`always()` 让移动端在「内核路径门控跳过」的提交上照样编译。
    if: >-
      always() &&
      github.ref_name != 'feature' &&
      needs.mobile_kernel.result == 'success' &&
      (
        needs.changes.outputs.nightly == 'true' ||
        (needs.changes.outputs.nightly != 'true' && github.event_name != 'schedule' &&
         github.event_name != 'pull_request' &&
         (needs.core_desktop.result == 'success' || needs.core_desktop.result == 'skipped'))
      )
    uses: ./.github/workflows/mobile.yml
    with:
      # nightly 只出 arm64 APK（最小自更新集），正式发版仍是 split-per-abi 全量。
      targets: ${{ needs.changes.outputs.nightly == 'true' && '["aarch64-linux-android"]' || 'all' }}
      build_version: ${{ needs.changes.outputs.nightly_version }}
    secrets: inherit

  # 移动端预编译内核库（P6）：与 core 同期产出 per-ABI 的 libexvlan_ffi.so，
  # 供 mobile 直接打包，从而不再在移动作业里重编内核。
  mobile_kernel:
    name: Mobile Kernel Libs
    needs: changes
    if: >-
      needs.changes.outputs.nightly == 'true' ||
      (needs.changes.outputs.nightly != 'true' && github.event_name != 'schedule' &&
       github.event_name != 'pull_request' && github.ref_name != 'feature')
    uses: ./.github/workflows/mobile-kernel.yml
    with:
      abis: ${{ needs.changes.outputs.nightly == 'true' && '["arm64-v8a"]' || 'all' }}
    secrets: inherit

  docker:
    name: Builder & Publish Docker Image
    # `changes` 只用于 nightly 门控（原本经 core 间接依赖，列出后时序不变）。
    needs: [changes, core]
    if: >-
      github.event_name != 'schedule' && github.event_name != 'pull_request' &&
      needs.changes.outputs.nightly != 'true' &&
      github.ref_name != 'feature' && needs.core.result == 'success'
    uses: ./.github/workflows/docker.yml
    with:
      mark_unstable: false
      mark_latest: ${{ github.ref == 'refs/heads/main' || github.ref_type == 'tag' }}
      is_alpha: ${{ !(github.ref == 'refs/heads/main' || github.ref_type == 'tag') }}
    secrets: inherit

  publish_sdk:
    name: Publish SDK (npm)
    needs: tests
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/publish-npm.yml
    with:
      dist_tag: latest
    secrets: inherit

  publish_go:
    name: Publish Go SDK
    needs: tests
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/publish-go.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit

  release:
    name: Release Publish
    if: |
      always() &&
      github.ref_type == 'tag' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (
        needs.core.result == 'success' ||
        needs.studio.result == 'success' ||
        needs.mobile.result == 'success'
      )
    # tests 必须在列：core 已不再 needs tests，release 要自己把测试门禁接回来
    needs: [tests, core, core_desktop, studio, mobile, publish_sdk, publish_go]
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ github.ref_name }} # tag 名即为版本号，如 v26.410.20715
      mark_latest: true
      is_alpha: false
    secrets: inherit

  # nightly：固定 tag `nightly` + 同一个 release 原地覆盖（docs/decisions-7.3.md §14.13）。
  # 只发「最小可自更新集」：内核 6 个镜像平台（含 minisign）、macOS x86_64/aarch64 与
  # Windows x86_64 的 updater 包、Android arm64 APK，以及应用/内核清单。
  # 不做 SignPath 签名与 Apple 公证（正式发版才做）。
  nightly_release:
    name: Nightly Publish
    needs: [changes, core, studio, mobile]
    # 上游任一环节没成功就不发：宁可保留上一轮 nightly，也不发半套包。
    if: >-
      always() &&
      needs.changes.outputs.nightly == 'true' &&
      needs.core.result == 'success' &&
      needs.studio.result == 'success' &&
      needs.mobile.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # body 要最近 10 条 commit；`git tag -f` 也要完整仓库
          fetch-depth: 0

      # 产物与 release.yml 同名同结构：core-<platform> / kernel-sig-<platform> /
      # studio-<name> / mobile-<arch>，pattern 精确拉取（排除 buildx 的 *.dockerbuild）。
      - name: Download core artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: release_assets
          pattern: core-*

      - name: Download kernel signature artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: release_assets
          pattern: kernel-sig-*

      - name: Download studio artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: release_assets
          pattern: studio-*

      - name: Download mobile artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: release_assets
          pattern: mobile-*

      - name: Sign kernels (minisign)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: bash script/ci/nightly-sign-kernels.sh

      - name: Package nightly assets
        env:
          VERSION: ${{ needs.changes.outputs.nightly_version }}
        run: bash script/ci/nightly-assets.sh

      # 发布前烟测：解压 linux 内核包验签名/sha256/`--version`。失败就停在这里，
      # 上一轮 nightly 原样保留（释放步骤在后面）。
      - name: Smoke test kernel package
        env:
          VERSION: ${{ needs.changes.outputs.nightly_version }}
        run: bash script/ci/nightly-smoke.sh

      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.changes.outputs.nightly_version }}
        run: bash script/ci/nightly-publish.sh

  # 无人值守运维通知：发版 / 失败自动推送到飞书群。
  # nightly（cron 或 dispatch 勾选）走下面的 nightly_notify，只报失败，不在这里重复推成功。
  notify:
    name: Notify (Feishu)
    if: >-
      always() && github.event_name != 'schedule' &&
      needs.changes.outputs.nightly != 'true'
    # `changes` 只用于 nightly 门控（原本经 core 间接依赖，时序不变）。
    needs: [changes, tests, core, studio, mobile]
    runs-on: ubuntu-latest
    steps:
      - name: Post result to Feishu
        # 通知失败绝不能影响流水线结论
        continue-on-error: true
        env:
          WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          T: ${{ needs.tests.result }}
          C: ${{ needs.core.result }}
          S: ${{ needs.studio.result }}
          M: ${{ needs.mobile.result }}
        run: |
          set -euo pipefail
          [ -n "${WEBHOOK:-}" ] || { echo "::notice::未配置 FEISHU_WEBHOOK，跳过"; exit 0; }
          text=$(python3 - <<'PY'
          import os
          ref = os.environ["REF"]; sha = os.environ["SHA"][:8]
          ev = os.environ["EVENT"]; url = os.environ["RUN_URL"]
          results = {"tests": os.environ["T"], "core": os.environ["C"],
                     "studio": os.environ["S"], "mobile": os.environ["M"]}
          bad = [k for k, v in results.items() if v == "failure"]
          ok = not bad
          lines = [f"【EXVlan {'✅ 全部通过' if ok else '❌ 有失败'}】{ref} @ {sha}",
                   f"事件: {ev}",
                   " · ".join(f"{k}={v}" for k, v in results.items())]
          if ok and ev == "push" and ref.startswith("v"):
              lines.append("Release 已发布")
          lines.append(url)
          print("\n".join(lines))
          PY
          )
          body=$(python3 -c 'import json,os,sys; print(json.dumps({"msg_type":"text","content":{"text":sys.argv[1]}}))' "$text")
          curl -sS -X POST -H 'Content-Type: application/json' -d "$body" "$WEBHOOK" -o /dev/null -w 'feishu=%{http_code}\n'

  # nightly 失败告警：**只在失败时**推送（成功不打扰）。
  # 门控用 inline 表达式而不是 `needs.changes.outputs.nightly`：`changes` 自己失败
  # （例如跨年守卫）时它的 outputs 是空的，反而会把这个告警也吞掉。
  # dispatch 手工触发时同理直接读 `inputs.nightly`（兼容布尔 true 与字符串 "true"/"1"）。
  nightly_notify:
    name: Nightly Failure (Feishu)
    if: >-
      failure() &&
      (
        (github.event_name == 'schedule' && github.event.schedule == '0 21 * * *') ||
        (github.event_name == 'workflow_dispatch' &&
         contains(fromJSON('["true", true, "1", 1]'), inputs.nightly))
      )
    needs: [changes, web_dist, core, studio, mobile, mobile_kernel, nightly_release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Post failure to Feishu
        # 通知失败绝不能影响流水线结论
        continue-on-error: true
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          VERSION: ${{ needs.changes.outputs.nightly_version }}
          C: ${{ needs.changes.result }}
          W: ${{ needs.web_dist.result }}
          K: ${{ needs.core.result }}
          S: ${{ needs.studio.result }}
          M: ${{ needs.mobile.result }}
          MK: ${{ needs.mobile_kernel.result }}
          R: ${{ needs.nightly_release.result }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          text=$(python3 - <<'PY'
          import os
          results = {
              "changes": os.environ["C"],
              "web_dist": os.environ["W"],
              "core": os.environ["K"],
              "studio": os.environ["S"],
              "mobile": os.environ["M"],
              "mobile_kernel": os.environ["MK"],
              "release": os.environ["R"],
          }
          bad = [k for k, v in results.items() if v in ("failure", "cancelled")]
          lines = [
              f"【EXVlan ❌ nightly 失败】{os.environ['VERSION'] or '版本未算出'} @ {os.environ['SHA'][:8]}",
              "失败环节: " + (", ".join(bad) if bad else "未知"),
              " · ".join(f"{k}={v}" for k, v in results.items()),
              "上一轮 nightly 保留（本轮未发布）",
              os.environ["RUN_URL"],
          ]
          print("\n".join(lines))
          PY
          )
          bash script/ci/feishu-notify.sh "$text"
