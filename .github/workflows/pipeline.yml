name: Builder & Publish Pipeline

on:
  push:
    - branches: ["develop", "feature", "main"]
      paths: &filter_paths
        - "Cargo.toml"
        - "Cargo.lock"
        - "exvlan/**"
        - ".github/workflows/*.yml"
        - "packages/**"
    - tags: ["v*"]

  pull_request:
    branches: [ "develop", "main" ]
    types: [ opened, synchronize, reopened, ready_for_review ]
    paths: *filter_paths

  workflow_dispatch:

permissions:
  contents: write
  actions: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash
 
jobs:
  tests:
    name: Core Tests
    uses: ./.github/workflows/test.yml
    secrets: inherit

  core:
    name: Build Core
    needs: tests
    if: needs.tests.result == 'success' || needs.tests.result == 'skipped'
    uses: ./.github/workflows/core.yml
    secrets: inherit

  studio:
    name: Build Studio GUI
    if: needs.core.result == 'success' || needs.core.result == 'skipped'
    needs: core
    uses: ./.github/workflows/studio.yml
    secrets: inherit

  mobile:
    name: Build Studio Mobile
    if: needs.core.result == 'success' || needs.core.result == 'skipped'
    needs: core
    uses: ./.github/workflows/mobile.yml
    secrets: inherit

  docker:
    name: Builder & Publish Docker Image
    if: needs.core.result == 'success'
    needs: core
    uses: ./.github/workflows/docker.yml
    with:
      mark_unstable: false
      mark_latest: ${{ github.ref == 'refs/heads/main' || github.ref_type == 'tag' }}
      is_alpha: ${{ !(github.ref == 'refs/heads/main' || github.ref_type == 'tag') }}
    secrets: inherit

  release:
    name: Release Publish
    if: |
      always() &&
      github.ref_type == 'tag' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (
        needs.core.result == 'success' || 
        needs.studio.result == 'success' || 
        needs.mobile.result == 'success'
      )
    needs: [core, studio, mobile]
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ github.ref_name }} # tag 名即为版本号，如 v26.308.20604
      mark_latest: true
      is_alpha: false
    secrets: inherit
