name: Builder & Publish Pipeline

on:
  push:
    branches: ["develop", "feature", "main"]
    tags: ["v*"]

  pull_request:
    branches: ["develop", "main"]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "flake.lock"
      - "**/*.nix"
      - "exvlan/**"
      - ".github/workflows/*.yml"
      - ".github/actions/**"
      - "packages/**"

  workflow_dispatch:
    inputs:
      publish:
        description: "Publish ohos HAR and dispatch downstream"
        type: boolean
        default: false
        required: false

  # 每周一 03:00 UTC：只跑依赖审计（无 push 也能发现新 advisory）。
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write
  actions: write
  packages: write
  pull-requests: read
  issues: write

concurrency:
  # 按 commit sha 去重：同一提交同时被分支与 tag 命中时（先推 develop 再推 tag），
  # 后触发的 tag 运行会取消分支运行，只保留一轮全链（含 release）。
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  # 统一编排入口：所有组件都经此依赖链调用，组件工作流不再各自触发。
  # 门控策略：
  #   - feature push / PR(develop,main)：仅 tests + core（轻量）；audit 按依赖路径门控（PR 全量）
  #   - develop/main push：core 链必跑；go/js/nix/ohos 按路径门控；audit 按依赖路径门控
  #   - tag v* / workflow_dispatch：全量（旁路绕过路径门控）+ release(tag) + audit（全量）
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      js: ${{ steps.filter.outputs.js }}
      nix: ${{ steps.filter.outputs.nix }}
      ohos: ${{ steps.filter.outputs.ohos }}
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: filter
        if: github.event_name == 'push' && github.ref_type != 'tag'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            go:
              - 'exvlan/go/**'
              - '.github/workflows/go.yml'
            js:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'exvlan/core/**'
              - 'exvlan/proto/**'
              - 'packages/sdk/**'
              - '.github/workflows/js.yml'
            nix:
              - '**/*.nix'
              - 'flake.lock'
              - 'rust-toolchain.toml'
            ohos:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - 'exvlan/**'
              - '.github/workflows/ohos.yml'
              - '.github/actions/**'
            deps:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '**/package.json'
              - '**/pnpm-lock.yaml'
              - '**/go.mod'
              - '**/go.sum'
              - '.cargo/audit.toml'
              - '.github/workflows/audit.yml'

  tests:
    name: Core Tests
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/test.yml
    secrets: inherit

  core:
    name: Build Core
    needs: tests
    if: >-
      github.event_name != 'schedule' &&
      (needs.tests.result == 'success' || needs.tests.result == 'skipped')
    uses: ./.github/workflows/core.yml
    with:
      targets: ${{ github.ref_name == 'feature' && '["x86_64-unknown-linux-musl"]' || 'all' }}
      build_magisk: ${{ github.ref_name != 'feature' }}
    secrets: inherit

  # 旁路组件：develop/main push 按路径门控；tag/dispatch 全量；feature/PR 跳过。
  go:
    name: Go Tests
    needs: changes
    if: >-
      github.event_name != 'pull_request' && github.ref_name != 'feature' &&
      (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true')
    uses: ./.github/workflows/go.yml
    secrets: inherit

  js:
    name: JavaScript Hosts
    needs: changes
    if: >-
      github.event_name != 'pull_request' && github.ref_name != 'feature' &&
      (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.js == 'true')
    uses: ./.github/workflows/js.yml
    secrets: inherit

  nix:
    name: Nix Check
    needs: changes
    if: >-
      github.event_name != 'pull_request' && github.ref_name != 'feature' &&
      (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.nix == 'true')
    uses: ./.github/workflows/nix.yml
    secrets: inherit

  # 依赖审计门禁：tag/dispatch 全量；PR 全量；push 按 manifest/lock 路径门控（含 feature——上游同步落在 feature）。
  audit:
    name: Dependency Audit
    needs: changes
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      github.ref_type == 'tag' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.deps == 'true'
    uses: ./.github/workflows/audit.yml
    secrets: inherit

  # 上游监控（仅 schedule）：对比 EasyTier/EasyTier 最新 release 与本地已同步的 v2.* tag。
  upstream_watch:
    name: Upstream Watch
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check upstream releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 不能用 releases/latest：该端点只返回非 prerelease。上游 EasyTier 的稳定 channel
          # 长期停在 v2.6.4，实际迭代都发在 prerelease（v2.7.0 / nightly），用 latest 会永远漏报。
          # 这里取全部 release（排除 draft 与 nightly 这类滚动 tag），按语义版本取最大。
          latest=$(gh api "repos/EasyTier/EasyTier/releases?per_page=100" --paginate \
            --jq '.[] | select(.draft == false) | .tag_name' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -uV | tail -n1 || true)
          # 已同步版本以仓库内唯一事实源为准（不再依赖 fork 上的 v2.* tag：
          # 上游 tag 未推送到本仓，之前 `synced` 恒为空 → 该 watch 实际从未生效）。
          synced=$(grep -E '^version:' docs/rules/workflow/upstream-path-map.yaml 2>/dev/null \
            | head -n1 | awk '{print $2}' | tr -d '"' || true)
          echo "upstream=${latest:-none} synced=${synced:-none}"
          if [ -z "${latest:-}" ]; then echo "no upstream release tag, skip"; exit 0; fi
          if [ -z "${synced:-}" ]; then echo "no synced version in upstream-path-map.yaml, skip"; exit 0; fi
          newest=$(printf '%s\n%s\n' "$synced" "$latest" | sort -V | tail -n1)
          if [ "$newest" = "$latest" ] && [ "$latest" != "$synced" ]; then
            existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 200 --json title \
              | jq --arg t "$latest" '[.[] | select(.title | contains($t))] | length')
            if [ "${existing:-1}" = "0" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" \
                --title "upstream: 新 release $latest 待同步" \
                --body "$(printf '检测到上游 `EasyTier/EasyTier` 发布了 **%s**，本地已同步到 **%s**。\n\n按 `.agents/skills/upstream-fork-sync` 流程同步：`upstream/releases/%s` → `feature` → 压缩进 `develop`。' "$latest" "$synced" "$latest")"
            else
              echo "open issue already exists for $latest, skip"
            fi
          else
            echo "already synced to $synced"
          fi

  ohos:
    name: OpenHarmony
    needs: [core, changes]
    if: >-
      github.event_name != 'pull_request' && github.ref_name != 'feature' &&
      (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.ohos == 'true')
    uses: ./.github/workflows/ohos.yml
    with:
      publish: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    secrets: inherit

  studio:
    name: Build Studio GUI
    needs: core
    if: >-
      github.event_name != 'schedule' && github.event_name != 'pull_request' &&
      github.ref_name != 'feature' &&
      (needs.core.result == 'success' || needs.core.result == 'skipped')
    uses: ./.github/workflows/studio.yml
    secrets: inherit

  mobile:
    name: Build Studio Mobile
    needs: core
    if: >-
      github.event_name != 'schedule' && github.event_name != 'pull_request' &&
      github.ref_name != 'feature' &&
      (needs.core.result == 'success' || needs.core.result == 'skipped')
    uses: ./.github/workflows/mobile.yml
    secrets: inherit

  docker:
    name: Builder & Publish Docker Image
    needs: core
    if: >-
      github.event_name != 'schedule' && github.event_name != 'pull_request' &&
      github.ref_name != 'feature' && needs.core.result == 'success'
    uses: ./.github/workflows/docker.yml
    with:
      mark_unstable: false
      mark_latest: ${{ github.ref == 'refs/heads/main' || github.ref_type == 'tag' }}
      is_alpha: ${{ !(github.ref == 'refs/heads/main' || github.ref_type == 'tag') }}
    secrets: inherit

  publish_sdk:
    name: Publish SDK (npm)
    needs: tests
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/publish-npm.yml
    with:
      dist_tag: latest
    secrets: inherit

  publish_go:
    name: Publish Go SDK
    needs: tests
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/publish-go.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit

  release:
    name: Release Publish
    if: |
      always() &&
      github.ref_type == 'tag' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (
        needs.core.result == 'success' ||
        needs.studio.result == 'success' ||
        needs.mobile.result == 'success'
      )
    needs: [core, studio, mobile, publish_sdk, publish_go]
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ github.ref_name }} # tag 名即为版本号，如 v26.410.20705
      mark_latest: true
      is_alpha: false
    secrets: inherit
