name: Builder OHOS

on:
  workflow_call: # push:

  #   branches: ["develop", "main", "releases/**"]
  #   tags:
  #     - 'v*'
  #     - '!*-pre'
  #   # 替代 fkirc，只有修改相关代码才触发 OHOS 构建
  #   paths: &ohos_paths
  #     - "Cargo.toml"
  #     - "Cargo.lock"
  #     - "exvlan/core/**"
  #     - "exvlan/contrib/ohrs/**"
  #     - ".github/workflows/ohos.yml"
  #     - ".github/actions/**"
  # pull_request:
  #   branches: ["develop", "main"]
  #   types: [opened, synchronize, reopened, ready_for_review]
  #   paths: *ohos_paths
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  cargo_fmt_check:
    name: Cargo fmt check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          gui: false
          pnpm: false

      - name: Install Rust fmt
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt

      - name: Check formatting
        working-directory: ./exvlan/contrib/ohrs
        run: cargo fmt --all -- --check

  build-ohos:
    name: Build HarmonyOS Har
    runs-on: ubuntu-latest
    needs: cargo_fmt_check
    env:
      OHPM_PUBLISH_CODE: ${{ secrets.OHPM_PUBLISH_CODE }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 必须拉取全部记录以进行版本计算

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -qq build-essential wget unzip git pkg-config curl libgl1-mesa-dev expect jq

      - name: Resolve exvlan version
        run: |
          # 优化后的版本计算逻辑
          CARGO_VERSION=$(cargo metadata --format-version 1 --no-deps --manifest-path exvlan/core/Cargo.toml | jq -r '.packages[0].version')
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          LAST_TAG_VERSION="${LAST_TAG#v}"

          # 使用 sort -V 进行版本比较
          if [ "$(printf '%s\n%s' "$CARGO_VERSION" "$LAST_TAG_VERSION" | sort -V | tail -n1)" = "$CARGO_VERSION" ]; then
            BASE_VERSION="$CARGO_VERSION"
          else
            BASE_VERSION="$LAST_TAG_VERSION"
          fi

          COMMIT_HASH=$(git rev-parse --short HEAD)
          EXVLAN_VERSION="${BASE_VERSION}-${COMMIT_HASH}"

          echo "EXVLAN_VERSION=$EXVLAN_VERSION" >> $GITHUB_ENV
          cd ./exvlan/contrib/ohrs/package
          jq --arg v "$EXVLAN_VERSION" '.version = $v' oh-package.json5 > oh-package.tmp.json5 && mv oh-package.tmp.json5 oh-package.json5

      - name: Setup HarmonyOS CLI tools
        uses: ErBWs/setup-ohos@v2

      - name: Download and Extract Custom SDK
        run: |
          wget https://github.com/FrankHan052176/Easytier-OHOS-sdk/releases/download/v1/ohos-sdk.zip -O /tmp/ohos-sdk.zip
          sudo unzip -o /tmp/ohos-sdk.zip -d /tmp/custom-sdk
          sudo cp -rf /tmp/custom-sdk/linux/native/* $OHOS_NDK_HOME/native

      - name: Setup build environment
        run: |
          rustup install stable
          rustup default stable

          rustup target add aarch64-unknown-linux-ohos

      - name: Install ohrs
        uses: taiki-e/install-action@v2.85.11
        with:
          tool: ohrs

      - name: Build latest Har
        working-directory: ./exvlan/contrib/ohrs
        run: |
          sudo apt-get install -y llvm clang protobuf-compiler
          source env.sh
          # 创建 clang wrapper 以确保 ohrs 正确识别交叉编译工具链
          mkdir -p $OHOS_NDK_HOME/native/llvm
          echo "#!/bin/sh" > $OHOS_NDK_HOME/native/llvm/aarch64-unknown-linux-ohos-clang.sh
          echo "exec $OHOS_NDK_HOME/native/llvm/bin/clang -target aarch64-linux-ohos --sysroot=$OHOS_NDK_HOME/native/sysroot -D__MUSL__ \"\$@\"" >> $OHOS_NDK_HOME/native/llvm/aarch64-unknown-linux-ohos-clang.sh
          chmod +x $OHOS_NDK_HOME/native/llvm/aarch64-unknown-linux-ohos-clang.sh

          ohrs build --release --arch aarch
          ohrs artifact
          mv package.har exvlan-ohrs.har

      - name: Build Release Package
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: ./exvlan/contrib/ohrs
        run: |
          echo "🎉 Official Release detected. Building exvlan-release..."
          TAG_NAME="${{ github.ref_name }}"
          TAG_VERSION="${TAG_NAME#v}"
          echo "Release Version: $TAG_VERSION"
          cd package
          jq --arg v "$TAG_VERSION" '.name = "exvlan-release" | .version = $v' oh-package.json5 > oh-package.tmp.json5 && mv oh-package.tmp.json5 oh-package.json5
          cd ..
          ohrs build --release --arch aarch
          cd dist/arm64-v8a
          mv libexvlan_ohrs.so libexvlan_release.so
          cd ../..
          ohrs artifact
          mv package.har exvlan-release.har

      - name: Archive OHOS Artifact
        uses: actions/upload-artifact@v7
        with:
          name: exvlan-ohos
          path: ./exvlan/contrib/ohrs/exvlan-ohrs.har
          retention-days: 5

      - name: Publish To OHPM Center
        working-directory: ./exvlan/contrib/ohrs
        env:
          OHPM_PRIVATE_KEY: ${{ secrets.OHPM_PRIVATE_KEY }}
          OHPM_KEY_PASSPHRASE: ${{ secrets.OHPM_KEY_PASSPHRASE }}
        if: github.event_name == 'push' && env.OHPM_PUBLISH_CODE != ''
        run: |
          ohpm config set publish_id "$OHPM_PUBLISH_CODE"
          ohpm config set publish_registry https://ohpm.openharmony.cn/ohpm
          TMP_DIR=$(mktemp -d)
          PRIVATE_KEY_FILE="$TMP_DIR/private_key"
          printf '%s' "$OHPM_PRIVATE_KEY" > "$PRIVATE_KEY_FILE"
          chmod 600 "$PRIVATE_KEY_FILE"
          ohpm config set key_path $PRIVATE_KEY_FILE
          unzip ohpm_crypto.zip -d /home/runner/work/
          ohpm config set crypto_path /home/runner/work/ohpm_crypto
          chmod 755 /home/runner/work/ohpm_crypto/*
          PASSPHRASE="$(printf '%s' "$OHPM_KEY_PASSPHRASE" | tr -d '\r\n')"
          ohpm config set key_passphrase "$PASSPHRASE"
          ohpm publish exvlan-ohrs.har

      - name: Publish To Private Ohpm
        working-directory: ./exvlan/contrib/ohrs
        if: ${{ env.OHPM_PUBLISH_CODE != '' && github.event_name == 'push' }}
        run: |
          printf '%s' "${{ secrets.CODEARTS_PRIVATE_OHPM }}" > ~/.ohpm/.ohpmrc
          ohpm config set strict_ssl false
          ohpm publish exvlan-ohrs.har
          if [ -f "exvlan-release.har" ]; then
             echo "🚀 Publishing Release package..."
             ohpm publish exvlan-release.har
          fi
          curl --header "Content-Type: application/json" --request POST --data "{}" ${{ secrets.CODEARTS_WEBHOOKS }}
