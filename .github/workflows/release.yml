name: Exvlan Release

on:
  workflow_call:
    inputs:
      version: { description: 'Version', type: string, required: false }
      mark_latest: { description: 'Mark as latest', type: boolean, default: true, required: false }
      is_alpha: { description: 'Is alpha', type: boolean, default: false, required: false }
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for this release'
        type: string
        default: 'v26.410.20700'
        required: true
      make_latest:
        description: 'Mark this release as latest'
        type: boolean
        default: true
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 产物由 Build Core / Studio / Mobile 以 Actions artifact 上传
      # （core-<platform> / studio-<name> / mobile-<arch> / magisk）；
      # 一次拉取本轮 run 的全部产物，避免 cache 10GB 配额 LRU 驱逐导致取不到。
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets

      - name: Package release assets
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p zipped_assets
          cd release_assets
          shopt -s nullglob

          # core-<platform> -> <platform>-<version>.zip（二进制置于 zip 根）
          for d in core-*; do
            name="${d#core-}"
            ( cd "$d" && zip -r "../../zipped_assets/${name}-${VERSION}.zip" . )
          done

          # magisk -> Exvlan-Magisk-<version>.zip（根）
          if [ -d magisk ]; then
            ( cd magisk && zip -r "../../zipped_assets/Exvlan-Magisk-${VERSION}.zip" . )
          fi

          # studio / mobile 安装包与 APK：摊平后原样上传
          for d in studio-* mobile-*; do
            find "$d" -type f -exec mv {} ../zipped_assets/ \;
          done

          cd ..
          echo "=== zipped_assets ==="
          ls -lR zipped_assets

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ inputs.version }}
          draft: false
          make_latest: true
          generate_release_notes: false
          body: |
            ## Exvlan ${{ inputs.version }}

            对应上游 EasyTier `v2.7.0`。

            ### 平台矩阵

            | 组件 | 平台 | 产物 |
            | --- | --- | --- |
            | Core | Windows x86_64 / i686 / arm64 | `exvlan`, `exvlan-cli`, `exvlan-api`, `exvlan-api-embed`（.exe） |
            | Core | macOS x86_64 / aarch64 | 同上 |
            | Core | Linux x86_64 / aarch64 / arm / armhf / armv7 / armv7hf / riscv64 / loongarch64 | 同上 |
            | Core | FreeBSD 13.2 x86_64 | 同上 |
            | Desktop GUI | macOS x86_64 | `.dmg` |
            | Desktop GUI | Windows x86_64 | `.msi` / `.exe` |
            | Mobile | Android arm64-v8a / armeabi-v7a / x86 / x86_64 | `.apk`（split-per-abi） |
            | Magisk | Android | `Exvlan-Magisk-*.zip` |
          files: |
            ./zipped_assets/*
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ inputs.version }}
