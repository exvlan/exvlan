name: Publish Release

on:
  workflow_dispatch:
    inputs:
      core_run_id:
        description: 'The run id of exvlan Core Action in exvlan repo'
        type: number
        required: true
      gui_run_id:
        description: 'The run id of exvlan GUI Action in exvlan repo'
        type: number
        required: true
      mobile_run_id:
        description: 'The run id of exvlan Mobile Action in exvlan repo'
        type: number
        required: true
      version:
        description: 'Version for this release'
        type: string
        default: 'v2026.26.1'
        required: true
      make_latest:
        description: 'Mark this release as latest'
        type: boolean
        default: true
        required: true
      is_alpha:
        description: 'Is this an alpha release from develop branch'
        type: boolean
        default: false
        required: false

permissions:
  contents: write
env:
  CARGO_TERM_COLOR: always
jobs:
  release:
    name: Release Publish
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v6

      - name: Download Core Artifact
        uses: dawidd6/action-download-artifact@v20
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          run_id: ${{ inputs.core_run_id }}
          repo: ${{ github.repository }}
          path: release_assets

      - name: Download GUI Artifact
        uses: dawidd6/action-download-artifact@v20
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          run_id: ${{ inputs.gui_run_id }}
          repo: ${{ github.repository }}
          path: release_assets_nozip

      - name: Download Mobile Artifact
        uses: dawidd6/action-download-artifact@v20
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          run_id: ${{ inputs.mobile_run_id }}
          repo: ${{ github.repository }}
          path: release_assets_nozip

      - name: Zip release assets
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir zipped_assets

          find release_assets_nozip -type f -exec mv {} zipped_assets \;
          ls -l -R ./zipped_assets

          cd release_assets
          ls -l -R ./
          chmod -R 755 .
          for x in `ls`; do
            if [ "$x" = "exvlan-magisk" ]; then
              # for exvlan-magisk, make sure files are in the root of the zip
              cd $x;
              zip -r ../../zipped_assets/$x-${VERSION}.zip .;
              cd ..;
            else
              zip -r ../zipped_assets/$x-${VERSION}.zip $x;
            fi
          done

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ inputs.version }}
          draft: true
          files: |
            ./zipped_assets/*
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ inputs.version }}