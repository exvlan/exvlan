name: Exvlan Release

on:
  workflow_call:
    inputs:
      version: { description: "Version", type: string, required: false }
      mark_latest: { description: "Mark as latest", type: boolean, default: true, required: false }
      is_alpha: { description: "Is alpha", type: boolean, default: false, required: false }
  workflow_dispatch:
    inputs:
      version:
        description: "Version for this release"
        type: string
        default: "v26.410.20703"
        required: true
      make_latest:
        description: "Mark this release as latest"
        type: boolean
        default: true
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # 产物由 Build Core / Studio / Mobile 以 Actions artifact 上传
      # （core-<platform> / studio-<name> / mobile-<arch> / magisk）。
      # 用 pattern 精确拉取，排除 docker buildx 产生的 `<owner>~<repo>~*.dockerbuild`
      # artifact（其名字含保留分隔符 `~`，会导致 download-artifact 解压失败）。
      - name: Download core artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: release_assets
          pattern: core-*

      - name: Download magisk artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          # v8 在 pattern 单命中时会把内容直接解到 path 根（不建同名子目录），
          # 因此这里显式指定子目录 + merge-multiple，保证打包脚本的 `[ -d magisk ]` 成立。
          path: release_assets/magisk
          pattern: magisk
          merge-multiple: true

      - name: Download studio artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: release_assets
          pattern: studio-*

      - name: Download mobile artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: release_assets
          pattern: mobile-*

      - name: Package release assets
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p zipped_assets
          cd release_assets
          shopt -s nullglob

          # core-<platform> -> <platform>-<version>.zip（二进制置于 zip 根）
          for d in core-*; do
            name="${d#core-}"
            ( cd "$d" && zip -r "../../zipped_assets/${name}-${VERSION}.zip" . )
          done

          # magisk -> Exvlan-Magisk-<version>.zip（根）
          if [ -d magisk ]; then
            ( cd magisk && zip -r "../../zipped_assets/Exvlan-Magisk-${VERSION}.zip" . )
          fi

          # studio / mobile 安装包与 APK：摊平后原样上传
          for d in studio-* mobile-*; do
            find "$d" -type f -exec mv {} ../zipped_assets/ \;
          done

          cd ..
          echo "=== zipped_assets ==="
          ls -lR zipped_assets

      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: ${{ inputs.version }}
          draft: false
          make_latest: true
          generate_release_notes: false
          body: |
            ## Exvlan ${{ inputs.version }}

            ### 平台矩阵

            | 组件 | 平台 | 产物 |
            | --- | --- | --- |
            | Core | Windows x86_64 / i686 / arm64 | `exvlan`, `exvlan-cli`, `exvlan-api`, `exvlan-api-embed`（.exe） |
            | Core | macOS x86_64 / aarch64 | 同上 |
            | Core | Linux x86_64 / aarch64 / arm / armhf / armv7 / armv7hf / riscv64 / loongarch64 | 同上 |
            | Core | FreeBSD 13.2 x86_64 | 同上 |
            | Desktop GUI | macOS x86_64 | `.dmg` |
            | Desktop GUI | Windows x86_64 | `.msi` / `.exe` |
            | Mobile | Android arm64-v8a / armeabi-v7a / x86 / x86_64 | `.apk`（split-per-abi） |
            | Magisk | Android | `Exvlan-Magisk-*.zip` |
          files: |
            ./zipped_assets/*
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ inputs.version }}
