name: Publish Release

on:
  workflow_call:
    inputs:
      version:
        description: 'Version for this release'
        type: string
        required: true
      mark_latest:
        description: 'Mark this release as latest'
        type: boolean
        default: true
      is_alpha:
        description: 'Is this an alpha release'
        type: boolean
        default: false

  workflow_dispatch:
    inputs:
      core_run_id:
        description: 'The run id of exvlan Core Action (used for manual workflow_dispatch)'
        type: number
        required: true
      gui_run_id:
        description: 'The run id of exvlan GUI Action (used for manual workflow_dispatch)'
        type: number
        required: true
      mobile_run_id:
        description: 'The run id of exvlan Mobile Action (used for manual workflow_dispatch)'
        type: number
        required: true
      version:
        description: 'Version for this release'
        type: string
        default: 'v26.206.17020604'
        required: true
      mark_latest:
        description: 'Mark this release as latest'
        type: boolean
        default: true
        required: true
      is_alpha:
        description: 'Is this an alpha release'
        type: boolean
        default: false
        required: false

permissions:
  contents: write
  actions: read

env:
  CARGO_TERM_COLOR: always
jobs:
  release:
    name: Release Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Core Artifact
        if: inputs.core_run_id != ''
        uses: dawidd6/action-download-artifact@v21
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          name: 'exvlan-(linux|macos|windows|freebsd)-.*|exvlan-dashboard|exvlan-magisk'
          name_is_regexp: true
          run_id: ${{ inputs.core_run_id }}
          repo: ${{ github.repository }}
          path: release_assets

      - name: Download Core Artifact (from workflow_call)
        if: inputs.core_run_id == ''
        uses: actions/download-artifact@v8
        with:
          pattern: |
            exvlan-linux-*
            exvlan-macos-*
            exvlan-windows-*
            exvlan-freebsd-*
            exvlan-dashboard
            exvlan-magisk
          path: release_assets

      - name: Download GUI Artifact
        if: inputs.core_run_id != ''
        uses: dawidd6/action-download-artifact@v21
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          name: 'exvlan-studio-.*'
          name_is_regexp: true
          run_id: ${{ inputs.gui_run_id }}
          repo: ${{ github.repository }}
          path: release_assets_nozip

      - name: Download GUI Artifact (from workflow_call)
        if: inputs.core_run_id == ''
        uses: actions/download-artifact@v8
        with:
          pattern: 'exvlan-studio-*'
          path: release_assets_nozip
          merge-multiple: true

      - name: Download Mobile Artifact
        if: inputs.core_run_id != ''
        uses: dawidd6/action-download-artifact@v21
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          name: 'exvlan-studio-.*'
          name_is_regexp: true
          run_id: ${{ inputs.mobile_run_id }}
          repo: ${{ github.repository }}
          path: release_assets_nozip

      - name: Download Mobile Artifact (from workflow_call)
        if: inputs.core_run_id == ''
        uses: actions/download-artifact@v8
        with:
          pattern: 'exvlan-studio-*'
          path: release_assets_nozip
          merge-multiple: true

      - name: Zip release assets
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p zipped_assets

          # 处理不需要二次 ZIP 的文件（如 APK, DMG, MSI）
          # 使用 find 将所有层级的产物移动到 zipped_assets 根目录
          if [ -d "release_assets_nozip" ]; then
            find release_assets_nozip -type f -exec cp {} zipped_assets/ 2>/dev/null || true
          fi

          # 处理需要二次 ZIP 的 Core 二进制文件
          if [ -d "release_assets" ]; then
            cd release_assets
            # 增加权限确保可执行
            chmod -R 755 . 2>/dev/null || true

            for x in *; do
              [ -e "$x" ] || continue
              if [ "$x" = "exvlan-magisk" ]; then
                # Magisk 模块特殊处理：不带父目录打包
                pushd "$x" 2>/dev/null || continue
                zip -r "../../zipped_assets/$x-${VERSION}.zip" . 2>/dev/null
                popd 2>/dev/null || true
              elif [[ ! "$x" == exvlan-studio-* ]]; then
                # 普通 Core 产物：带目录打包以保持结构
                zip -r "../zipped_assets/$x-${VERSION}.zip" "$x" 2>/dev/null || true
              fi
            done
            cd ..
          fi

          echo "=================================================="
          echo "📦 Final Assets to be uploaded:"
          ls -lh ./zipped_assets/ 2>/dev/null || echo "No assets found"
          echo "=================================================="

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ inputs.version }}
          draft: true
          prerelease: ${{ inputs.is_alpha }}
          make_latest: ${{ inputs.mark_latest }}
          files: |
            ./zipped_assets/*
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ inputs.version }}
