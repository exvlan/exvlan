name: Exvlan Release

on:
  workflow_call:
    inputs:
      version: { description: "Version", type: string, required: false }
      mark_latest: { description: "Mark as latest", type: boolean, default: true, required: false }
      is_alpha: { description: "Is alpha", type: boolean, default: false, required: false }
  workflow_dispatch:
    inputs:
      version:
        description: "Version for this release"
        type: string
        default: "v26.410.20713"
        required: true
      make_latest:
        description: "Mark this release as latest"
        type: boolean
        default: true
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # 产物由 Build Core / Studio / Mobile 以 Actions artifact 上传
      # （core-<platform> / studio-<name> / mobile-<arch> / magisk）。
      # 用 pattern 精确拉取，排除 docker buildx 产生的 `<owner>~<repo>~*.dockerbuild`
      # artifact（其名字含保留分隔符 `~`，会导致 download-artifact 解压失败）。
      - name: Download core artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: release_assets
          pattern: core-*

      - name: Download magisk artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          # v8 在 pattern 单命中时会把内容直接解到 path 根（不建同名子目录），
          # 因此这里显式指定子目录 + merge-multiple，保证打包脚本的 `[ -d magisk ]` 成立。
          path: release_assets/magisk
          pattern: magisk
          merge-multiple: true

      - name: Download studio artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: release_assets
          pattern: studio-*

      - name: Download mobile artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: release_assets
          pattern: mobile-*

      # 内核签名（minisign）：来自 studio 的 `kernel-sig-<platform>` 产物。
      # 一个都没有时不阻塞发版 —— 打包步骤会逐平台打印 `::warning::`（该包将无法
      # 在线升级），不会静默漏掉。
      - name: Download kernel signature artifacts
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: release_assets
          pattern: kernel-sig-*

      - name: Package release assets
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p zipped_assets
          cd release_assets
          shopt -s nullglob

          # core-<platform> -> <platform>-<version>.zip（二进制置于 zip 根）
          # 内核签名来自 studio 产物 `kernel-sig-<platform>/`（名字与平台键一致）：
          # 服务端 `kernel.install.*` 只安装 minisign 校验通过的内核，缺签名的包
          # 装上就会被拒，所以必须与二进制一起进 zip（文件名为 `<entry>.sig`）。
          for d in core-*; do
            name="${d#core-}"
            if [ -f "$d/exvlan.exe" ]; then entry=exvlan.exe; else entry=exvlan; fi
            sig=""
            if [ -f "kernel-sig-${name}/${entry}.sig" ]; then
              sig="kernel-sig-${name}/${entry}.sig"
            elif [ -f "${entry}.sig" ]; then
              # download-artifact 在 pattern 只命中一个产物时会把内容摊到 path 根，
              # 没有子目录可查（多平台发版时不会走到这里）。
              sig="${entry}.sig"
            fi
            if [ -n "$sig" ]; then
              cp "$sig" "$d/${entry}.sig"
              echo "core-${name}: 已带上内核签名 $(basename "$sig")"
            else
              echo "::warning::core-${name} 缺少内核签名 ${entry}.sig（未找到 kernel-sig-${name} 产物）—— 该包无法在线升级，服务端会以 sig_invalid 拒绝"
            fi
            ( cd "$d" && zip -r "../../zipped_assets/${name}-${VERSION}.zip" . )
          done

          # magisk -> Exvlan-Magisk-<version>.zip（根）
          if [ -d magisk ]; then
            ( cd magisk && zip -r "../../zipped_assets/Exvlan-Magisk-${VERSION}.zip" . )
          fi

          # studio / mobile 安装包与 APK：摊平后原样上传
          # 注意：pattern `mobile-*` 也会拉到 `mobile-kernel-<abi>`（预编译内核库），
          # 内核已打在 APK 内，这里跳过，避免把裸 .so 混进 release 资产。
          for d in studio-* mobile-*; do
            case "$d" in
              mobile-kernel-*) continue ;;
            esac
            find "$d" -type f -exec mv {} ../zipped_assets/ \;
          done

          # 预览版：安装包文件名带上完整版本串（含 -pre.N），
          # 避免与正式版同名被误下载；正式版（tag 无 '-'）跳过。
          if [[ "$VERSION" == *-* ]]; then
            # tag 带 v 前缀（v26.410.20713-pre.9），文件名里没有
            ver="${VERSION#v}"
            base="${ver%%-*}"
            pre="${ver#*-}"
            for f in ../zipped_assets/*; do
              # .sig 必须跟着一起改名，否则 install.sh/manifest 会找不到配对签名
              case "$f" in
                *.dmg|*.msi|*.exe|*.dmg.sig|*.msi.sig|*.exe.sig) ;;
                *) continue ;;
              esac
              case "$(basename "$f")" in
                *"$base"*) mv "$f" "${f//$base/$ver}" ;;
              esac
            done
            for f in ../zipped_assets/app-*-release.apk; do
              [ -e "$f" ] || continue
              mv "$f" "${f%.apk}-${pre}.apk"
            done
          fi

          cd ..
          echo "=== zipped_assets ==="
          ls -lR zipped_assets

      # 应用更新清单：自建 manifest（GUI 回退用）+ 官方 updater latest.json（minisign）。
      - name: Generate app upgrade manifests
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # 通道由 tag 后缀推导：-rc/-beta/-dev/-nightly → 对应通道；无后缀 = stable
          case "${VERSION}" in
            *-rc.*) CHANNEL=rc ;;
            *-beta.*) CHANNEL=beta ;;
            *-dev.*) CHANNEL=dev ;;
            *-nightly.*) CHANNEL=nightly ;;
            *) CHANNEL=stable ;;
          esac
          echo "CHANNEL=${CHANNEL}" >> "$GITHUB_ENV"
          python3 script/gen_upgrade_manifests.py \
            --assets-dir zipped_assets \
            --version "${VERSION#v}" \
            --channel "${CHANNEL}" \
            --macos-arch x86_64 \
            --notes "Exvlan ${VERSION#v}"
          ls -l zipped_assets/upgrade-*.json

      # 汇总各平台内核元数据 + 计算内核包 sha256，产出 manifest.json。
      # 客户端据此判断版本、校验完整性（sha256 针对下载到的 zip 本体）。
      - name: Generate kernel manifest
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, sys

          version = os.environ["VERSION"]
          # RPC 契约与最低 GUI 基线：单一真源在 script/ci/kernel-compat.json
          # （schema 变更时必须同时改 min_studio_version，避免“升级了 schema 忘了升 GUI”）
          compat = json.loads(
              pathlib.Path("script/ci/kernel-compat.json").read_text(encoding="utf-8")
          )
          RPC_SCHEMA = int(compat["rpc_schema"])
          MIN_STUDIO = str(compat["min_studio_version"])

          assets = {}
          for meta_path in sorted(pathlib.Path("release_assets").glob("core-*/kernel.json")):
              meta = json.loads(meta_path.read_text(encoding="utf-8"))
              platform = meta["platform"]
              zip_path = pathlib.Path("zipped_assets") / f"{platform}-{version}.zip"
              if not zip_path.is_file():
                  sys.exit(f"[manifest] 缺少内核包 {zip_path}")
              digest = hashlib.sha256()
              with zip_path.open("rb") as fh:
                  for chunk in iter(lambda: fh.read(1 << 20), b""):
                      digest.update(chunk)
              assets[platform] = {
                  "file": zip_path.name,
                  "sha256": digest.hexdigest(),
                  "entry": meta["entry"],
              }

          if not assets:
              sys.exit("[manifest] 未找到任何内核产物（core-*/kernel.json）")

          manifest = {
              "schema": 1,
              "channel": os.environ.get("CHANNEL", "stable"),
              "latest": version,
              "versions": [{
                  "version": version,
                  "rpc_schema": RPC_SCHEMA,
                  "min_studio_version": MIN_STUDIO,
                  "assets": assets,
              }],
          }
          out = pathlib.Path("zipped_assets/manifest.json")
          out.write_text(json.dumps(manifest, indent=2, ensure_ascii=False), encoding="utf-8")
          print(f"[manifest] {len(assets)} 个平台已写入 {out}")
          PY

      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: ${{ inputs.version }}
          draft: false
          # 预览标签（含 `-`，如 v26.410.20713-pre.8）标记为 prerelease 且不抢占 latest
          prerelease: ${{ contains(inputs.version, '-') }}
          make_latest: ${{ !contains(inputs.version, '-') }}
          generate_release_notes: false
          body: |
            ## Exvlan ${{ inputs.version }}

            ### 平台矩阵

            | 组件 | 平台 | 产物 |
            | --- | --- | --- |
            | Core | Windows x86_64 / i686 / arm64 | `exvlan`, `exvlan-cli`, `exvlan-api`, `exvlan-api-embed`（.exe） |
            | Core | macOS x86_64 / aarch64 | 同上 |
            | Core | Linux x86_64 / aarch64 / arm / armhf / armv7 / armv7hf / riscv64 / loongarch64 | 同上 |
            | Core | FreeBSD 13.2 x86_64 | 同上 |
            | Desktop GUI | macOS x86_64 | `.dmg` |
            | Desktop GUI | Windows x86_64 | `.msi` / `.exe` |
            | Mobile | Android arm64-v8a / armeabi-v7a / x86 / x86_64 | `.apk`（split-per-abi） |
            | Magisk | Android | `Exvlan-Magisk-*.zip` |
          files: |
            ./zipped_assets/*
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ inputs.version }}
