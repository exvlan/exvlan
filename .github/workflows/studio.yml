name: Builder Studio

on:
  workflow_call:
    inputs:
      targets:
        description: 'Build targets: JSON array of target triples, or "all"'
        type: string
        default: "all"
      kernel_from_previous:
        description: >-
          为 'true' 时不在本 run 构建内核，而是从最近一次成功的 pipeline 运行
          复用桌面内核产物（纯前端改动时用，省掉 12 个内核 target 的构建）。
        type: string
        default: "false"
  workflow_dispatch:
    inputs:
      targets:
        description: 'Build targets: JSON array of target triples, or "all"'
        default: "all"
      kernel_from_previous:
        description: "从最近一次成功运行复用内核产物（true/false）"
        default: "false"

permissions:
  contents: read
  actions: write

concurrency:
  group: studio-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"

defaults:
  run:
    shell: bash

jobs:
  pre_job:
    name: Run Pre check
    # continue-on-error: true # Uncomment once integration is finished
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    outputs:
      should_skip: "false"
    steps:
      - run: echo "Skip disabled (pipeline chaining requires artifacts)"

  prepare_matrix:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    outputs:
      include: ${{ steps.gen.outputs.include }}
    steps:
      - name: Generate matrix include
        id: gen
        run: |
          python3 - '${{ inputs.targets }}' <<'PY'
          import json, os, sys

          ALL = [
            {"TARGET": "x86_64-apple-darwin", "OS": "macos-latest", "GUI_TARGET": "x86_64-apple-darwin", "ARTIFACT_NAME": "macos-x86_64"},
            {"TARGET": "x86_64-pc-windows-msvc", "OS": "windows-latest", "GUI_TARGET": "x86_64-pc-windows-msvc", "ARTIFACT_NAME": "windows-x86_64"},
          ]

          selected = sys.argv[1]
          if selected == "all":
              result = ALL
          else:
              wanted = set(json.loads(selected))
              result = [e for e in ALL if e["TARGET"] in wanted]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("include=" + json.dumps(result) + "\n")
          print(json.dumps(result))
          PY

  build:
    strategy:
      # One matrix leg failing at the final upload step (e.g. artifact quota)
      # must not cancel the other legs' already-running builds.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare_matrix.outputs.include) }}

    runs-on: ${{ matrix.OS }}
    env:
      NAME: exvlan
      TARGET: ${{ matrix.TARGET }}
      OS: ${{ matrix.OS }}
      GUI_TARGET: ${{ matrix.GUI_TARGET }}
      # pre.17 是唯一随包分发 `exvlan-migrate` 的版本。下一版改仓库变量
      # `BUNDLE_MIGRATE=0`（不需要改代码/改断言）即可停止随包；
      # 未设置时默认 1，保持当前行为。
      BUNDLE_MIGRATE: ${{ vars.BUNDLE_MIGRATE || '1' }}
    needs: [pre_job, prepare_matrix]
    if: ${{ needs.pre_job.outputs.should_skip != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set current ref as env variable
        run: |
          echo "GIT_DESC=$(git log -1 --format=%cd.%h --date=format:%Y-%m-%d_%H:%M:%S)" >> $GITHUB_ENV

      - name: Compute build version
        run: bash script/ci/build-version.sh

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          target: ${{ matrix.TARGET }}
          gui: true
          pnpm: true
          pnpm-build-filter: ""
          token: ${{ secrets.GITHUB_TOKEN }}

      # Tauri 要求 npm 包与 Rust crate 的 major.minor 一致，不一致时 build 会在耗时构建末端才报错；
      # 这里提前快速失败并给出可读原因。
      - name: Check Tauri npm/Rust version alignment
        run: node script/check_tauri_versions.mjs

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: ""
          # 每个 target 独立 key（之前两个 target 共用一个，命中率互相挤）
          shared-key: "studio-${{ matrix.GUI_TARGET }}"
          cache-targets: true

      # 内核二进制来自 core 产物（不再由 GUI 编译），放进 bundle resources。
      # 内核来自本 run（正常路径）
      - name: Fetch kernel from core artifact
        if: inputs.kernel_from_previous != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: core-${{ matrix.ARTIFACT_NAME }}
          path: ./core-artifacts

      # 复用最近一次成功运行的内核（纯前端改动，内核没变）
      - name: Resolve previous core run
        if: inputs.kernel_from_previous == 'true'
        id: kernel_src
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME}"
          run_id=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/pipeline.yml/runs?branch=${branch}&status=success&per_page=30" \
            --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")] | .[0].id // empty')
          if [[ -z "$run_id" ]]; then
            echo "::error::找不到可复用的成功运行（branch=${branch}），无法获取内核产物"
            exit 1
          fi
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "reuse core artifacts from run ${run_id} (branch=${branch})"

      - name: Fetch kernel from previous core run
        if: inputs.kernel_from_previous == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: core-${{ matrix.ARTIFACT_NAME }}
          path: ./core-artifacts
          run-id: ${{ steps.kernel_src.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Stage kernel into bundle resources
        run: |
          set -euo pipefail
          mkdir -p packages/studio/src-tauri/resources/kernel
          if [[ "$GUI_TARGET" =~ windows ]]; then
            cp ./core-artifacts/exvlan.exe packages/studio/src-tauri/resources/kernel/
          else
            cp ./core-artifacts/exvlan packages/studio/src-tauri/resources/kernel/
          fi
          chmod +x packages/studio/src-tauri/resources/kernel/exvlan || true
          ls -l packages/studio/src-tauri/resources/kernel/

      # 特权服务（macOS + Windows）：唯一的常驻特权进程。
      # 首次安装授权一次；之后的升级通过 IPC 自更新（`service.update`），零弹窗。
      # 同时构建控制面工具（gateway / cli / migrate），它们都是本机控制面的一部分：
      # - gateway：127.0.0.1 的 HTTP/WS，CLI / agent / 远端客户端用
      # - cli：产品子命令（service/doctor/diag/auth/api）+ 上游内核 CLI
      # - migrate：pre.17 的一次性迁移（下个版本从安装包移除）
      - name: Build privileged service and control-plane tools
        run: |
          set -euo pipefail
          BUNDLE_MIGRATE="${BUNDLE_MIGRATE:-1}"
          TOOLS="exvlan-gateway exvlan-cli"
          PACKAGES="-p exvlan-service -p exvlan-gateway"
          if [ "$BUNDLE_MIGRATE" = "1" ]; then
            TOOLS="$TOOLS exvlan-migrate"
            PACKAGES="$PACKAGES -p exvlan-migrate"
          fi
          cargo build --release $PACKAGES --target "$GUI_TARGET"
          cargo build --release -p exvlan --bin exvlan-cli --features management,cli \
            --target "$GUI_TARGET"
          EXE=""
          [[ "$GUI_TARGET" =~ windows ]] && EXE=".exe"
          mkdir -p packages/studio/src-tauri/resources/service packages/studio/src-tauri/resources/tools
          cp "target/$GUI_TARGET/release/exvlan-service$EXE" packages/studio/src-tauri/resources/service/
          for b in $TOOLS; do
            cp "target/$GUI_TARGET/release/$b$EXE" packages/studio/src-tauri/resources/tools/
          done
          echo "bundled tools: $TOOLS (BUNDLE_MIGRATE=$BUNDLE_MIGRATE)"
          chmod +x packages/studio/src-tauri/resources/service/* packages/studio/src-tauri/resources/tools/* || true
          ls -l packages/studio/src-tauri/resources/service/ packages/studio/src-tauri/resources/tools/

      # 内核 + 服务本体签名：服务只安装 minisign 校验通过的包
      # （复用 updater 私钥，无需新 secret）。
      - name: Sign kernel and service (minisign)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          set -euo pipefail
          cd packages/studio
          if [[ "$GUI_TARGET" =~ windows ]]; then
            KERNEL=exvlan.exe
            SERVICE=exvlan-service.exe
          else
            KERNEL=exvlan
            SERVICE=exvlan-service
          fi
          pnpm tauri signer sign "src-tauri/resources/kernel/$KERNEL"
          pnpm tauri signer sign "src-tauri/resources/service/$SERVICE"
          ls -l src-tauri/resources/kernel/ src-tauri/resources/service/

      - name: copy correct DLLs (Windows)
        if: ${{ contains(matrix.GUI_TARGET, 'windows') }}
        run: |
          case $TARGET in
              x86_64*)  ARCH_DIR=x86_64 ;;
              i686*)    ARCH_DIR=i686 ;;
              aarch64*) ARCH_DIR=arm64 ;;
          esac
          if [[ -n "$ARCH_DIR" ]]; then
              find "./exvlan/exvlan/third_party/${ARCH_DIR}" -maxdepth 1 -type f \( -name "*.dll" -o -name "*.sys" -o -name "*.lib" \) -exec cp {} ./packages/studio/src-tauri/ \;
          fi

      # 预览版之间 MSI ProductVersion 必须严格递增，否则 Windows 会当成“同版本”
      # 走修复式安装（见 script/ci/msi-version.py）
      - name: Apply Windows MSI version
        if: ${{ contains(matrix.GUI_TARGET, 'windows') }}
        run: |
          set -euo pipefail
          msi=$(python3 script/ci/msi-version.py "${EXVLAN_BUILD_VERSION:?}")
          python3 - "$msi" <<'PY'
          import json, sys
          path = "packages/studio/src-tauri/tauri.windows.conf.json"
          data = json.load(open(path, encoding="utf-8"))
          data.setdefault("bundle", {}).setdefault("windows", {}).setdefault("wix", {})[
              "version"
          ] = sys.argv[1]
          open(path, "w", encoding="utf-8").write(json.dumps(data, indent=2, ensure_ascii=False) + "\n")
          print("wix.version =", sys.argv[1])
          PY

      - name: Build GUI (Tauri)
        if: ${{ matrix.GUI_TARGET != '' }}
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          RUSTFLAGS: "-L native=${{ github.workspace }}/packages/studio/src-tauri/"
          CARGO_TERM_COLOR: always
          # 官方 updater 的 minisign 私钥（tauri.conf.json 里 createUpdaterArtifacts=true 必需）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: ./packages/studio
          args: --verbose --target ${{ matrix.GUI_TARGET }}

      # 断言内核确实被打进产物（不是只看 staging 目录）。
      # 断言内核确实被打进产物。
      # - macOS：路径固定（.app/Contents/Resources），严格失败
      # - Windows：Tauri 只把资源塞进 MSI/NSIS（CAB 内容 7z 不可列），
      #   输出目录没有副本属正常 → 校验 staging 并告警，不阻塞
      - name: Verify service bundled
        run: |
          set -euo pipefail
          BIN=exvlan-service
          [[ "$GUI_TARGET" =~ windows ]] && BIN=exvlan-service.exe
          # 1) staging 目录（构建机）
          test -f "packages/studio/src-tauri/resources/service/$BIN" \
            || { echo "::error::staging 目录缺少 $BIN"; exit 1; }
          test -f "packages/studio/src-tauri/resources/service/$BIN.sig" \
            || { echo "::error::缺少服务签名 $BIN.sig"; exit 1; }

          # 2) 真实产物。staging 有 ≠ 打进包里 —— pre.13 的 Windows 事故就是
          #    `tauri.windows.conf.json` 整体替换 resources 后漏了 service，
          #    staging 检查却照样通过。
          if [[ "$GUI_TARGET" =~ darwin ]]; then
            hits=$(find "target/$GUI_TARGET/release/bundle/macos" -path '*Resources*' -name 'exvlan-service' 2>/dev/null | wc -l)
            [ "$hits" -ge 1 ] || { echo "::error::.app 内没有 exvlan-service"; exit 1; }
            REQUIRED="exvlan-gateway exvlan-cli"
            [ "${BUNDLE_MIGRATE:-1}" = "1" ] && REQUIRED="$REQUIRED exvlan-migrate"
            for f in $REQUIRED; do
              found=$(find "target/$GUI_TARGET/release/bundle/macos" -path '*Resources*' -name "$f" 2>/dev/null | wc -l)
              [ "$found" -ge 1 ] || { echo "::error::.app 内没有 $f（检查 resources/tools 与 studio.yml）"; ls -R "target/$GUI_TARGET/release/bundle/macos" | grep -i -m20 exvlan || true; exit 1; }
            done
            echo "macOS bundle contains exvlan-service + $REQUIRED ($hits service hits)"
          elif [[ "$GUI_TARGET" =~ windows ]]; then
            # NSIS 的 setup.exe 是自解压包，7z 可以列出内容；MSI 的 CAB 不行。
            setup=$(find "target/$GUI_TARGET/release/bundle/nsis" -name '*-setup.exe' 2>/dev/null | head -1)
            [ -n "$setup" ] || { echo "::error::未找到 NSIS setup.exe"; exit 1; }
            7z l "$setup" > /tmp/nsis-list.txt || { echo "::error::7z 无法列出 $setup"; exit 1; }
            grep -q 'exvlan-service.exe' /tmp/nsis-list.txt \
              || { echo "::error::$setup 里没有 exvlan-service.exe（检查 tauri.windows.conf.json 的 resources）"; grep -i exvlan /tmp/nsis-list.txt || true; exit 1; }
            REQUIRED="exvlan-gateway.exe exvlan-cli.exe"
            [ "${BUNDLE_MIGRATE:-1}" = "1" ] && REQUIRED="$REQUIRED exvlan-migrate.exe"
            for f in $REQUIRED; do
              grep -q "$f" /tmp/nsis-list.txt \
                || { echo "::error::$setup 里没有 $f（检查 resources/tools 与 studio.yml 的构建步骤）"; grep -i exvlan /tmp/nsis-list.txt || true; exit 1; }
            done
            echo "NSIS 安装包包含: exvlan-service.exe $REQUIRED"
          fi

      - name: Verify kernel bundled
        run: |
          set -euo pipefail
          strict=1
          if [[ "$GUI_TARGET" =~ darwin ]]; then
            hits=$(find "target/$GUI_TARGET/release/bundle/macos" -path '*Contents/Resources*' -name 'exvlan' 2>/dev/null | wc -l)
          elif [[ "$GUI_TARGET" =~ windows ]]; then
            [ -f packages/studio/src-tauri/resources/kernel/exvlan.exe ] \
              && echo "staged kernel: $(wc -c < packages/studio/src-tauri/resources/kernel/exvlan.exe) bytes" \
              || { echo "::error::staging 目录缺少 exvlan.exe"; exit 1; }
            hits=$(find "target/$GUI_TARGET/release" -name 'exvlan.exe' \
              -not -path '*/build/*' -not -path '*/deps/*' -not -path '*/.fingerprint/*' 2>/dev/null | wc -l)
            strict=0
          else
            hits=$(find "target/$GUI_TARGET/release/bundle" -name 'exvlan' 2>/dev/null | wc -l)
          fi

          echo "bundled kernel occurrences: $hits"
          # 打印实际落点，便于核对运行时 resource_dir 的相对路径
          if [[ "$GUI_TARGET" =~ darwin ]]; then
            find "target/$GUI_TARGET/release/bundle/macos" -name 'exvlan' 2>/dev/null | head -3 | while read -r f; do
              echo "bundled at: ${f#target/$GUI_TARGET/release/bundle/macos/}"
            done
          fi
          if [ "$hits" -lt 1 ]; then
            echo "--- diagnostics ---"
            find "target/$GUI_TARGET/release/bundle" -maxdepth 2 -type f 2>/dev/null | head -20 || true
            if [ "$strict" = "1" ]; then
              echo "::error::内核未打进安装包（resources/kernel 未生效）"
              exit 1
            fi
            echo "::warning::Windows 输出目录未找到内核副本（属 Tauri 打包行为，staging 已校验）"
          fi

      - name: Collect artifact
        run: |
          mkdir -p ./artifacts/
          # 除安装包外还要收集官方 updater 的产物：macOS 的 .app.tar.gz 与其 .sig，
          # Windows/Linux 的 .sig（签名随 latest.json 发布）。
          if [[ $GUI_TARGET =~ windows ]]; then
              find ./target/$GUI_TARGET/release/bundle/ -type f \( -name "*.msi" -o -name "*.exe" -o -name "*.sig" \) -exec cp {} ./artifacts/ \; 2>/dev/null || true
          elif [[ $GUI_TARGET =~ darwin ]]; then
              find ./target/$GUI_TARGET/release/bundle/ -type f \( -name "*.dmg" -o -name "*.sig" -o -name "*.app.tar.gz" \) -exec cp {} ./artifacts/ \; 2>/dev/null || true
          elif [[ $GUI_TARGET =~ linux ]]; then
              # 扩展匹配：包含 .deb, .rpm 和 .AppImage
              find ./target/$GUI_TARGET/release/bundle/ -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.sig" \) -exec cp {} ./artifacts/ \; 2>/dev/null || true
          fi

          # 打印列表，确保你在日志中能看到到底抓取了哪些文件
          echo "Collected artifacts:"
          ls -F ./artifacts/

      - name: Cache artifact
        uses: actions/cache/save@v6
        with:
          key: studio-${{ github.sha }}-${{ matrix.ARTIFACT_NAME }}
          path: ./artifacts

      - name: Upload studio artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: studio-${{ matrix.ARTIFACT_NAME }}
          path: ./artifacts
          if-no-files-found: error
          retention-days: 14
