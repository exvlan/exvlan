name: Builder Studio

on:
  workflow_call:
    inputs:
      targets:
        description: 'Build targets: JSON array of target triples, or "all"'
        type: string
        default: 'all'
  workflow_dispatch:
    inputs:
      targets:
        description: 'Build targets: JSON array of target triples, or "all"'
        default: 'all'

permissions:
  contents: read
  actions: write

concurrency:
  group: studio-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  pre_job:
    name: Run Pre check
    # continue-on-error: true # Uncomment once integration is finished
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    # Map a step output to a job output
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip == 'true' && !startsWith(github.ref_name, 'releases/') }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          # All of these options are optional, so you can remove them if you are happy with the defaults
          concurrent_skipping: 'same_content_newer'
          skip_after_successful_duplicate: 'true'
          cancel_others: 'true'
          paths: '["Cargo.toml", "Cargo.lock", "exvlan/core/**", "packages/studio/**", ".github/workflows/studio.yml", ".github/actions/**", "packages/kit/**"]'

  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          # - TARGET: x86_64-unknown-linux-musl
          #   OS: ubuntu-24.04
          #   GUI_TARGET: x86_64-unknown-linux-gnu
          #   ARTIFACT_NAME: linux-x86_64
          # - TARGET: aarch64-unknown-linux-musl
          #   OS: ubuntu-24.04-arm
          #   GUI_TARGET: aarch64-unknown-linux-gnu
          #   ARTIFACT_NAME: linux-aarch64

          - TARGET: x86_64-apple-darwin
            OS: macos-latest
            GUI_TARGET: x86_64-apple-darwin
            ARTIFACT_NAME: macos-x86_64
          # - TARGET: aarch64-apple-darwin
          #   OS: macos-latest
          #   GUI_TARGET: aarch64-apple-darwin
          #   ARTIFACT_NAME: macos-aarch64

          - TARGET: x86_64-pc-windows-msvc
            OS: windows-latest
            GUI_TARGET: x86_64-pc-windows-msvc
            ARTIFACT_NAME: windows-x86_64
          # - TARGET: i686-pc-windows-msvc
          #   OS: windows-latest
          #   GUI_TARGET: i686-pc-windows-msvc
          #   ARTIFACT_NAME: windows-i686
          # - TARGET: aarch64-pc-windows-msvc
          #   OS: windows-11-arm
          #   GUI_TARGET: aarch64-pc-windows-msvc
          #   ARTIFACT_NAME: windows-arm64

    runs-on: ${{ matrix.OS }}
    env:
      NAME: exvlan
      TARGET: ${{ matrix.TARGET }}
      OS: ${{ matrix.OS }}
      GUI_TARGET: ${{ matrix.GUI_TARGET }}
    needs: pre_job
    if: ${{ needs.pre_job.outputs.should_skip != 'true' && (inputs.targets == 'all' || contains(fromJSON(inputs.targets), matrix.TARGET)) }}    
    steps:
      - uses: actions/checkout@v7

      - name: Set current ref as env variable
        run: |
          echo "GIT_DESC=$(git log -1 --format=%cd.%h --date=format:%Y-%m-%d_%H:%M:%S)" >> $GITHUB_ENV

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          target: ${{ matrix.TARGET }}
          gui: true
          pnpm: true
          pnpm-build-filter: ''
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ""
          shared-key: "exvlan-shared"
          cache-targets: true

      - name: copy correct DLLs (Windows)
        if: ${{ contains(matrix.GUI_TARGET, 'windows') }}
        run: |
          case $TARGET in
              x86_64*)  ARCH_DIR=x86_64 ;;
              i686*)    ARCH_DIR=i686 ;;
              aarch64*) ARCH_DIR=arm64 ;;
          esac
          if [[ -n "$ARCH_DIR" ]]; then
              find "./exvlan/core/third_party/${ARCH_DIR}" -maxdepth 1 -type f \( -name "*.dll" -o -name "*.sys" -o -name "*.lib" \) -exec cp {} ./packages/studio/src-tauri/ \;
          fi

      - name: Build GUI (Tauri)
        if: ${{ matrix.GUI_TARGET != '' }}
        uses: tauri-apps/tauri-action@v1
        env:
          RUSTFLAGS: "-L native=${{ github.workspace }}/packages/studio/src-tauri/"
          CARGO_TERM_COLOR: always
        with:
          projectPath: ./packages/studio
          args: --verbose --target ${{ matrix.GUI_TARGET }}

      - name: Collect artifact
        run: |
          mkdir -p ./artifacts/
          if [[ $GUI_TARGET =~ windows ]]; then
              find ./target/$GUI_TARGET/release/bundle/ -type f \( -name "*.msi" -o -name "*.exe" \) -exec cp {} ./artifacts/ \; 2>/dev/null || true
          elif [[ $GUI_TARGET =~ darwin ]]; then
              find ./target/$GUI_TARGET/release/bundle/ -type f -name "*.dmg" -exec cp {} ./artifacts/ \; 2>/dev/null || true
          elif [[ $GUI_TARGET =~ linux ]]; then
              # 扩展匹配：包含 .deb, .rpm 和 .AppImage
              find ./target/$GUI_TARGET/release/bundle/ -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) -exec cp {} ./artifacts/ \; 2>/dev/null || true
          fi
          
          # 打印列表，确保你在日志中能看到到底抓取了哪些文件
          echo "Collected artifacts:"
          ls -F ./artifacts/

      - name: Archive artifact
        uses: actions/upload-artifact@v7
        with:
          name: exvlan-studio-${{ matrix.ARTIFACT_NAME }}
          path: |
            ./artifacts/*
          if-no-files-found: error

  result:
    name: GUI Result Check
    runs-on: ubuntu-latest
    needs: [ pre_job, build ]
    if: needs.pre_job.result == 'success' && needs.pre_job.outputs.should_skip != 'true' && !cancelled()
    steps:
      - name: Mark result as failed
        if: contains(needs.*.result, 'failure')
        run: exit 1
