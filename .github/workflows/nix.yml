name: Nix Check

on:
  workflow_call:
  push:
    branches: ["main", "develop"]
    paths: &nix_paths
      - "**/*.nix"
      - "flake.lock"
      - "rust-toolchain.toml"
  pull_request:
    branches: ["main", "develop"]
    types: [opened, synchronize, reopened, ready_for_review]
    paths: *nix_paths

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-full-shell:
    name: Check Full Shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}


      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Warm up full devShell
        run: nix develop .#full --command true

      - name: Cargo check in flake environment
        run: nix develop .#full --command cargo check

      - name: Cargo build in flake environment
        run: nix develop .#full --command cargo build
