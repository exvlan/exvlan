name: Builder Mobile

on:
  push:
    branches: ["main", "develop", "releases/**"]
    tags:
      - 'v*'
      - '!*-pre'
  pull_request:
    branches: ["main", "develop"]
      
permissions:
  contents: read
  actions: write

env:
  CARGO_TERM_COLOR: always
  BUILD_TOOLS_VERSION: "35.0.0"
  NDK_VERSION: "27.3.13750724"

defaults:
  run:
    shell: bash

jobs:
  pre_job:
    name: Run Pre check
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip == 'true' && !startsWith(github.ref_name, 'releases/') }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          concurrent_skipping: 'same_content_newer'
          skip_after_successful_duplicate: 'true'
          cancel_others: 'true'
          paths: '["Cargo.toml", "Cargo.lock", "exvlan/**", "packages/studio/**", "exvlan/plugin/vpnservice/**", ".github/workflows/mobile.yml", ".github/workflows/install_rust.sh"]'

  build-mobile:
    name: Build Mobile
    strategy:
      fail-fast: false
      matrix:
        include:
          - TARGET: android
            OS: ubuntu-22.04
            ARTIFACT_NAME: android
    runs-on: ${{ matrix.OS }}
    # 保留用户要求的环境变量
    env:
      NAME: exvlan
      TARGET: ${{ matrix.TARGET }}
      OS: ${{ matrix.OS }}
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'    
    steps:
      - uses: actions/checkout@v6

      - name: Set current ref as env variable
        run: |
          echo "GIT_DESC=$(git log -1 --format=%cd.%h --date=format:%Y-%m-%d_%H:%M:%S)" >> $GITHUB_ENV

      - uses: actions/setup-java@v5
        with:
          distribution: 'oracle'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 14742923
          packages: "build-tools;${{ env.BUILD_TOOLS_VERSION }} ndk;${{ env.NDK_VERSION }} platform-tools platforms;android-35"

      - name: Setup Android Environment
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/build-tools/${{ env.BUILD_TOOLS_VERSION }}" >> $GITHUB_PATH
          echo "$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
          echo "NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}/" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}/" >> $GITHUB_ENV

      - name: Setup Frontend Environment
        uses: ./.github/actions/prepare-pnpm

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-android"

      - name: Install rust target
        run: |
          bash ./.github/workflows/install_rust.sh
          rustup target add aarch64-linux-android x86_64-linux-android

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Android
        run: |
          cd packages/studio
          pnpm tauri android build --apk --target aarch64 --target x86_64 

      - name: Prepare Artifacts
        run: |
          mkdir -p ./artifacts
          APK_DIR="packages/studio/src-tauri/gen/android/app/build/outputs/apk/universal/release/"
          
          UNSIGNED_SRC=$(find "$APK_DIR" -name "app-universal-release-unsigned.apk" | head -n 1)
          if [[ -f "$UNSIGNED_SRC" ]]; then
            # 按照要求使用 ${NAME} 重命名
            cp "$UNSIGNED_SRC" "./artifacts/${NAME}-universal-release-unsigned.apk"
            cp "$UNSIGNED_SRC" "./artifacts/${NAME}-universal-release.apk"
          else
            echo "❌ 错误: 找不到生成的 APK 文件于 $APK_DIR"
            exit 1
          fi

      - name: Sign APK
        run: |
          TEMP_DIR="./temp_signing"
          mkdir -p "$TEMP_DIR"
          trap 'rm -rf "$TEMP_DIR"' EXIT

          KEYSTORE_PATH="$TEMP_DIR/release.jks"
          UNSIGNED_APK="./artifacts/${NAME}-universal-release-unsigned.apk"
          SIGNED_APK="./artifacts/${NAME}-release-latest.apk"
          
          if [[ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" || -z "${{ secrets.KEYSTORE_PASSWORD }}" || -z "${{ secrets.KEYSTORE_ALIAS }}" ]]; then
            echo "⚠️ 警告: 缺少配置，跳过签名。"
            exit 0
          fi

          echo "🔑 还原 Keystore..."
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_PATH"
          if [[ ! -s "$KEYSTORE_PATH" ]]; then
            echo "❌ 错误: Keystore 还原为空，跳过签名。"
            exit 0
          fi

          echo "📦 Zipalign 对齐..."
          zipalign -f 4 "$UNSIGNED_APK" "$TEMP_DIR/aligned.apk"

          echo "✍️ 签名 APK..."
          apksigner sign \
            --ks "$KEYSTORE_PATH" \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --ks-key-alias "${{ secrets.KEYSTORE_ALIAS }}" \
            --key-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --out "$SIGNED_APK" \
            "$TEMP_DIR/aligned.apk"

          echo "🧪 验证签名..."
          if apksigner verify "$SIGNED_APK"; then
            echo "✅ 签名成功: ${SIGNED_APK}"
            cp "$SIGNED_APK" "./artifacts/${NAME}-universal-release.apk"
          else
            echo "❌ 验证失败，跳过签名。"
            exit 0
          fi

      - name: Archive artifact
        uses: actions/upload-artifact@v7
        with:
          name: exvlan-studio-${{ matrix.ARTIFACT_NAME }}
          path: |
            ./artifacts/*.apk

  mobile-result:
    name: Mobile Result Check
    if: needs.pre_job.outputs.should_skip != 'true' && always()
    runs-on: ubuntu-latest
    needs:
      - pre_job
      - build-mobile
    steps:
      - name: Mark result as failed
        if: needs.build-mobile.result != 'success'
        run: exit 1
