name: Builder Mobile

on:
  workflow_call:
    inputs:
      targets:
        description: 'Build targets: JSON array of target triples, or "all"'
        type: string
        default: 'all'
  workflow_dispatch:
    inputs:
      targets:
        description: 'Build targets: JSON array of target triples, or "all"'
        default: 'all'

permissions:
  contents: read
  actions: write

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  BUILD_TOOLS_VERSION: "36.1.0"
  NDK_VERSION: "28.2.13676358"
  TARGET_SDK_VERSION: "36"

defaults:
  run:
    # necessary for windows
    shell: bash

jobs:
  pre_job:
    name: Run Pre check
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    outputs:
      should_skip: 'false'
    steps:
      - run: echo "Skip disabled (pipeline chaining requires artifacts)"

  prepare_matrix:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    outputs:
      include: ${{ steps.gen.outputs.include }}
    steps:
      - name: Generate matrix include
        id: gen
        run: |
          python3 - '${{ inputs.targets }}' <<'PY'
          import json, os, sys

          ALL = [
            {"TARGET": "aarch64-linux-android", "ARCH": "aarch64"},
            {"TARGET": "armv7-linux-androideabi", "ARCH": "armv7"},
            {"TARGET": "x86_64-linux-android", "ARCH": "x86_64"},
          ]

          selected = sys.argv[1]
          if selected == "all":
              result = ALL
          else:
              wanted = set(json.loads(selected))
              result = [e for e in ALL if e["TARGET"] in wanted]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("include=" + json.dumps(result) + "\n")
          print(json.dumps(result))
          PY

  build:
    strategy:
      # ABI 构建彼此独立：一个 ABI 失败/上传失败不应取消其余已完成的构建
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare_matrix.outputs.include) }}

    runs-on: ubuntu-latest
    env:
      NAME: exvlan
      TARGET: ${{ matrix.TARGET }}
      ARCH: ${{ matrix.ARCH }}
    needs: [ pre_job, prepare_matrix ]
    if: ${{ needs.pre_job.outputs.should_skip != 'true' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set current ref as env variable
        run: |
          echo "GIT_DESC=$(git log -1 --format=%cd.%h --date=format:%Y-%m-%d_%H:%M:%S)" >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'oracle'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 14742923
          packages: 'build-tools;${{ env.BUILD_TOOLS_VERSION }} ndk;${{ env.NDK_VERSION }} platform-tools platforms;android-${{ env.TARGET_SDK_VERSION }}'
        env:
          ANDROID_SDK_ROOT:  ${{ github.workspace }}/android-sdk

      - name: Setup Android Environment
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/build-tools/${{ env.BUILD_TOOLS_VERSION }}" >> $GITHUB_PATH
          echo "$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
          echo "NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}/" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}/" >> $GITHUB_ENV
      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          target: ${{ matrix.TARGET }}
          gui: false
          pnpm: true
          pnpm-build-filter: ''
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "exvlan-shared"
          cache-targets: true

      - name: Prepare Keystore File
        run: |
          # 1. 创建临时目录存储密钥（确保安全）
          mkdir -p ./keys
          
          # 2. 将 Base64 Secret 解码为二进制文件
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > ./keys/release.keystore
          
          # 3. 将文件绝对路径写入 $GITHUB_ENV 供后续步骤使用
          # 同时也把其他非敏感的别名等信息存入环境变量
          echo "KEYSTORE_PATH=$(pwd)/keys/release.keystore" >> $GITHUB_ENV
          echo "KEYSTORE_ALIAS=${{ secrets.KEYSTORE_ALIAS }}" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV

      - name: Build Android APK
        run: |
          cd packages/studio
          pnpm tauri android build --apk --target "$ARCH" --split-per-abi
        env:
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - name: Collect artifact
        run: |
          mkdir -p ./artifacts/
          # 收集 APK
          find packages/studio/src-tauri/gen/android/app/build/outputs/apk/ -name "*.apk" -exec cp {} ./artifacts/ \; 2>/dev/null || true
          # 打印列表，确保 CI 日志可见
          echo "📦 Collected APKs:"
          ls -F ./artifacts/

      - name: Archive artifact
        uses: actions/upload-artifact@v7
        with:
          name: exvlan-studio-${{ matrix.ARCH }}
          path: ./artifacts/*.apk
          if-no-files-found: error
          # 防止 artifact 跨 run 无限累积耗尽存储配额：
          # 同名覆盖（每 ABI 只保留最新一份）+ 短期保留
          overwrite: true
          retention-days: 3
