name: Exvlan Mobile

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    # necessary for windows
    shell: bash

jobs:
  pre_job:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    env:
      RELEVANT_PATHS: >-
        ["Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".cargo/**",
        "pnpm-lock.yaml", "pnpm-workspace.yaml", "package.json", "exvlan/**",
        "exvlan/core/**", "exvlan/proto/**", "exvlan/proto/build/**",
        "packages/studio/**", "tauri-plugin-vpnservice/**",
        "packages/std/**", ".github/workflows/mobile.yml",
        ".github/actions/**"]
    outputs:
      # 仅 PR 按路径门控跳过；push/tag/dispatch 一律构建（pipeline 已统一门控）。
      should_skip: >-
        ${{
          github.event_name == 'pull_request' &&
          steps.path_filter.outputs.relevant != 'true'
        }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5
        with:
          concurrent_skipping: "same_content_newer"
          skip_after_successful_duplicate: "true"
          cancel_others: "true"
          paths: ${{ env.RELEVANT_PATHS }}

      - id: path_filter
        if: >-
          github.event_name == 'pull_request' &&
          steps.skip_check.outputs.should_skip != 'true'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            relevant: ${{ env.RELEVANT_PATHS }}

  build-mobile:
    strategy:
      fail-fast: true
      matrix:
        include:
          - TARGET: aarch64-linux-android
            ARCH: aarch64
          - TARGET: armv7-linux-androideabi
            ARCH: armv7
          - TARGET: i686-linux-android
            ARCH: i686
          - TARGET: x86_64-linux-android
            ARCH: x86_64
    runs-on: ubuntu-latest
    env:
      NAME: exvlan
      TARGET: ${{ matrix.TARGET }}
      ARCH: ${{ matrix.ARCH }}
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set current ref as env variable
        run: |
          echo "GIT_DESC=$(git log -1 --format=%cd.%h --date=format:%Y-%m-%d_%H:%M:%S)" >> $GITHUB_ENV

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: "oracle"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: 12.0
          packages: "build-tools;34.0.0 ndk;26.0.10792818 platform-tools platforms;android-34 "

      - name: Setup Android Environment
        run: |
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/ndk/26.0.10792818/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.0.10792818/" >> $GITHUB_ENV

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          target: ${{ matrix.TARGET }}
          gui: false
          pnpm: true
          pnpm-build-filter: ""
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # The prefix cache key, this can be changed to start a new cache manually.
          # default: "v0-rust"
          prefix-key: ""
          shared-key: "gui-registry"
          cache-targets: "false"

      - name: Build
        run: |
          cd packages/studio
          pnpm tauri android build --apk --target "$ARCH" --split-per-abi

      - name: Collect artifact
        run: |
          mkdir -p ./artifacts/objects/
          mv packages/studio/src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk ./artifacts/objects/

          if [[ $GITHUB_REF_TYPE =~ ^tag$ ]]; then
            TAG=$GITHUB_REF_NAME
          else
            TAG=$GITHUB_SHA
          fi

          mv ./artifacts/objects/* ./artifacts/
          rm -rf ./artifacts/objects/

      - name: Cache artifact
        uses: actions/cache/save@v4
        with:
          key: mobile-${{ github.sha }}-${{ matrix.ARCH }}
          path: ./artifacts

      - name: Upload mobile artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mobile-${{ matrix.ARCH }}
          path: ./artifacts
          if-no-files-found: error
          retention-days: 14

  mobile-result:
    runs-on: ubuntu-latest
    needs: [pre_job, build-mobile]
    if: needs.pre_job.result == 'success' && needs.pre_job.outputs.should_skip != 'true' && !cancelled()
    steps:
      - name: Mark result as failed
        if: contains(needs.*.result, 'failure')
        run: exit 1
