name: Exvlan Mobile

on:
  workflow_call:
    inputs:
      targets:
        description: 'Android targets: JSON array of rust triples, or "all"'
        type: string
        default: "all"
      build_version:
        description: >-
          版本串覆盖（nightly 用固定 tag `nightly`，无法从 ref 推导版本）。
          留空 = 沿用 `script/ci/build-version.sh` 的默认规则。
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      targets:
        description: 'Android targets: JSON array of rust triples, or "all"'
        default: "all"
      build_version:
        description: "版本串覆盖（留空 = 默认规则）"
        default: ""

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    # necessary for windows
    shell: bash

jobs:
  pre_job:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    env:
      RELEVANT_PATHS: >-
        ["Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".cargo/**", "pnpm-lock.yaml", "pnpm-workspace.yaml", "package.json", "exvlan/**", "exvlan/core/**", "exvlan/proto/**", "exvlan/proto/build/**", "packages/studio/**", "tauri-plugin-vpnservice/**", "packages/std/**", ".github/workflows/mobile.yml", ".github/actions/**"]
    outputs:
      # 仅 PR 按路径门控跳过；push/tag/dispatch 一律构建（pipeline 已统一门控）。
      should_skip: >-
        ${{
          github.event_name == 'pull_request' &&
          steps.path_filter.outputs.relevant != 'true'
        }}
    steps:
      - id: skip_check
        # schedule（nightly）下必须跳过：skip-duplicate 会因「同内容上一轮已成功」
        # 或 cancel_others 把这一轮判成重复/取消掉，夜间构建就会静默缺失。
        if: github.event_name != 'schedule'
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5
        with:
          concurrent_skipping: "same_content_newer"
          skip_after_successful_duplicate: "true"
          # 同 core.yml：只在 PR 上取消旧运行。push 的去重交给 pipeline 的
          # concurrency；cancel_others=true 会连带取消同分支仍在跑的 nightly。
          cancel_others: ${{ github.event_name == 'pull_request' }}
          paths: ${{ env.RELEVANT_PATHS }}

      - id: path_filter
        if: >-
          github.event_name == 'pull_request' && steps.skip_check.outputs.should_skip != 'true'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            relevant: ${{ env.RELEVANT_PATHS }}

  prepare_matrix:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    outputs:
      include: ${{ steps.gen.outputs.include }}
    steps:
      - name: Generate matrix include
        id: gen
        run: |
          python3 - '${{ inputs.targets }}' <<'PY'
          import json, os, sys

          ALL = [
              {"TARGET": "aarch64-linux-android", "ARCH": "aarch64"},
              {"TARGET": "armv7-linux-androideabi", "ARCH": "armv7"},
              {"TARGET": "i686-linux-android", "ARCH": "i686"},
              {"TARGET": "x86_64-linux-android", "ARCH": "x86_64"},
          ]

          # targets 只做「缩小范围」：nightly 只要 arm64（最小自更新集），
          # 正式发版仍传 all（split-per-abi 全量）。
          selected = sys.argv[1] if len(sys.argv) > 1 else "all"
          if selected in ("", "all"):
              result = ALL
          else:
              wanted = set(json.loads(selected))
              result = [e for e in ALL if e["TARGET"] in wanted]
          if not result:
              sys.exit(f"targets 没有匹配到任何 Android target：{selected}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("include=" + json.dumps(result) + "\n")
          print(json.dumps(result))
          PY

  build-mobile:
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.prepare_matrix.outputs.include) }}
    runs-on: ubuntu-latest
    env:
      NAME: exvlan
      TARGET: ${{ matrix.TARGET }}
      ARCH: ${{ matrix.ARCH }}
      # nightly 等「版本不由 ref 决定」的构建从这里注入（空值 = 默认规则）
      EXVLAN_BUILD_VERSION_OVERRIDE: ${{ inputs.build_version }}
    needs: [pre_job, prepare_matrix]
    if: needs.pre_job.outputs.should_skip != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set current ref as env variable
        run: |
          echo "GIT_DESC=$(git log -1 --format=%cd.%h --date=format:%Y-%m-%d_%H:%M:%S)" >> $GITHUB_ENV

      - name: Compute build version
        run: bash script/ci/build-version.sh

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: "oracle"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          # 长版本号（build）而非短版本：ubuntu-26.04 预装 cmdline-tools 20.0 = 14742923。
          # 写短版本（如 12.0）会被直接拼进下载 URL → commandlinetools-linux-12_latest.zip → 404。
          cmdline-tools-version: 14742923
          packages: "build-tools;34.0.0 ndk;26.0.10792818 platform-tools platforms;android-34 "

      - name: Setup Android Environment
        run: |
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/ndk/26.0.10792818/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.0.10792818/" >> $GITHUB_ENV

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          target: ${{ matrix.TARGET }}
          gui: false
          pnpm: true
          pnpm-build-filter: ""
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # The prefix cache key, this can be changed to start a new cache manually.
          # default: "v0-rust"
          prefix-key: ""
          shared-key: "gui-registry"
          cache-targets: "false"

      # P7：移动端不得再编译内核 crate（依赖树层面硬拦）。
      - name: Assert no exvlan-core in android dependency tree
        run: |
          set -euo pipefail
          tree=$(cargo tree -p exvlan-studio --target "${{ matrix.TARGET }}" 2>/dev/null || true)
          if echo "$tree" | grep -q 'exvlan-core'; then
            echo "::error::移动端依赖树仍包含 exvlan-core（P7 回归）"
            echo "$tree" | grep -B4 'exvlan-core'
            exit 1
          fi
          echo "::notice::exvlan-core 不在 android 依赖树中"

      # P6：把 ARCH（aarch64/armv7/i686/x86_64）映射成 Android ABI 名
      - name: Resolve kernel ABI
        id: kabi
        run: |
          case "$ARCH" in
            aarch64) echo "abi=arm64-v8a" >> "$GITHUB_OUTPUT" ;;
            armv7)   echo "abi=armeabi-v7a" >> "$GITHUB_OUTPUT" ;;
            i686)    echo "abi=x86" >> "$GITHUB_OUTPUT" ;;
            x86_64)  echo "abi=x86_64" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::unknown ARCH $ARCH"; exit 1 ;;
          esac

      # P6：下载本 ABI 的预编译内核库并放进 jniLibs（studio 不再编内核）。
      # 缺库必须直接失败：曾因 continue-on-error 产出一个「库在包里但没链接」的闪退版。
      - name: Fetch prebuilt kernel lib
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: mobile-kernel-${{ steps.kabi.outputs.abi }}
          path: ./kernel-lib

      - name: Stage kernel lib into jniLibs
        run: |
          set -euo pipefail
          abi="${{ steps.kabi.outputs.abi }}"
          test -f ./kernel-lib/libexvlan_ffi.so || {
            echo "::error::缺少 libexvlan_ffi.so（mobile-kernel-$abi 工件不完整）"
            exit 1
          }
          mkdir -p "packages/studio/src-tauri/gen/android/app/src/main/jniLibs/$abi"
          # 只放 FFI 库：libexvlan_core.so / libboringtun / libtun 是内核构建的冗余产物，
          # libexvlan_ffi.so 的 NEEDED 只有 libc/libm/libdl。
          cp ./kernel-lib/libexvlan_ffi.so "packages/studio/src-tauri/gen/android/app/src/main/jniLibs/$abi/"
          ls -l "packages/studio/src-tauri/gen/android/app/src/main/jniLibs/$abi/"

      # APK 签名：必须用仓库 secrets 里的正式 keystore。
      # 历史上仓库里那把 upload-keystore.jks 密码是错的，构建静默回退 debug 签名，
      # 而 debug keystore 每个 runner 随机生成 → 每次发版签名都不同，无法覆盖安装。
      - name: Prepare release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_ALIAS_SECRET: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "::error::缺少 ANDROID_KEYSTORE_BASE64"; exit 1; }
          keystore="$RUNNER_TEMP/exvlan-upload.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$keystore"
          keytool -list -keystore "$keystore" -storepass "$KEYSTORE_PASSWORD_SECRET" > /dev/null
          echo "KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_ALIAS=$KEYSTORE_ALIAS_SECRET" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
          echo "::notice::keystore 已就绪（alias=$KEYSTORE_ALIAS_SECRET）"

      - name: Build
        env:
          # 桌面 updater 的签名密钥；移动端构建不需要，但统一注入避免 bundler 误判
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          cd packages/studio
          pnpm tauri android build --apk --target "$ARCH" --split-per-abi

      # 硬断言：闪退根因（未链接 FFI）与签名回退都在这里拦下。
      - name: Verify APK linkage and signature
        env:
          EXPECTED_CERT_SHA256: "2556EBD965FA0DEE2C4166011ECE0927E2859EB6F828499048D3A0D144F7FA04"
        run: |
          set -euo pipefail
          apk=$(ls packages/studio/src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk | head -1)
          echo "APK: $apk"
          rm -rf /tmp/apkcheck && mkdir -p /tmp/apkcheck
          unzip -o -q "$apk" 'lib/*/libapp_lib.so' -d /tmp/apkcheck
          lib=$(find /tmp/apkcheck -name libapp_lib.so | head -1)

          echo "--- NEEDED ---"
          readelf -d "$lib" | grep NEEDED || true
          readelf -d "$lib" | grep -q 'libexvlan_ffi.so' || {
            echo "::error::libapp_lib.so 未链接 libexvlan_ffi.so（启动会闪退）"
            exit 1
          }
          APKSIGNER="$(command -v apksigner || true)"
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER=$(ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          fi
          test -x "${APKSIGNER:-}" || { echo "::error::找不到 apksigner"; exit 1; }
          cert=$("$APKSIGNER" verify --print-certs "$apk" | grep -m1 'SHA-256 digest' | awk '{print $NF}' | tr 'A-F' 'a-f')
          expected=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr 'A-F' 'a-f')
          echo "apk cert sha256 = $cert"
          [ "$cert" = "$expected" ] || {
            echo "::error::APK 未使用正式 keystore 签名（got $cert），禁止发布"
            exit 1
          }
          echo "::notice::APK 链接与签名校验通过"

      - name: Collect artifact
        run: |
          mkdir -p ./artifacts/objects/
          mv packages/studio/src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk ./artifacts/objects/

          if [[ $GITHUB_REF_TYPE =~ ^tag$ ]]; then
            TAG=$GITHUB_REF_NAME
          else
            TAG=$GITHUB_SHA
          fi

          mv ./artifacts/objects/* ./artifacts/
          rm -rf ./artifacts/objects/

      - name: Cache artifact
        uses: actions/cache/save@v6
        with:
          key: mobile-${{ github.sha }}-${{ matrix.ARCH }}
          path: ./artifacts

      - name: Upload mobile artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mobile-${{ matrix.ARCH }}
          path: ./artifacts

      # 真机验证用的 arm64 debug 包（可 `adb shell run-as` 直读 files/config/*.toml）。
      # 由仓库变量 `BUILD_DEBUG_APK=1` 开启；平时不构建、不影响发版。
      # 用正式 release keystore 重签 → `adb install -r` 可覆盖正式包（保留设备旧数据）。
      - name: Build debug APK for device verification
        if: matrix.ARCH == 'aarch64' && vars.BUILD_DEBUG_APK == '1'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          set -euo pipefail
          cd packages/studio
          pnpm tauri android build --apk --debug --target "$ARCH"
          cd ../..
          src=$(ls packages/studio/src-tauri/gen/android/app/build/outputs/apk/*/debug/*.apk | head -1)
          echo "debug apk: $src"
          btdir=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$btdir/zipalign" -f -p 4 "$src" "$RUNNER_TEMP/aligned.apk"
          "$btdir/apksigner" sign \
            --ks "$KEYSTORE_PATH" --ks-key-alias "$KEYSTORE_ALIAS" \
            --ks-pass "env:KEYSTORE_PASSWORD" --key-pass "env:KEYSTORE_PASSWORD" \
            --out "$RUNNER_TEMP/app-arm64-debug.apk" "$RUNNER_TEMP/aligned.apk"
          "$btdir/apksigner" verify --print-certs "$RUNNER_TEMP/app-arm64-debug.apk" | head -3
          mkdir -p ./debug-apk
          cp "$RUNNER_TEMP/app-arm64-debug.apk" ./debug-apk/

      - name: Upload debug APK
        if: matrix.ARCH == 'aarch64' && vars.BUILD_DEBUG_APK == '1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: app-arm64-debug
          path: ./debug-apk/app-arm64-debug.apk
          if-no-files-found: error
          retention-days: 14

  mobile-result:
    runs-on: ubuntu-latest
    # prepare_matrix 也必须在列：矩阵生成失败时 build-mobile 会被跳过，
    # 只检查 build-mobile 会让这条作业「绿着」放过一次没出包的运行。
    needs: [pre_job, prepare_matrix, build-mobile]
    if: needs.pre_job.result == 'success' && needs.pre_job.outputs.should_skip != 'true' && !cancelled()
    steps:
      # `cancelled` 也要算失败：子作业被取消（runner 回收 / 被并发取代）时
      # 之前的实现会把它当 success，下游 `studio`/`mobile` 于是被静默跳过，
      # 表现为「CI 绿了但没出 GUI 包」。整轮 run 被取消时本作业会 skip，不误报。
      - name: Mark result as failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
