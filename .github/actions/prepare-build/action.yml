name: prepare-build
author: Luna
description: Prepare build environment
inputs:
  target:
    description: "The target to build for"
    required: false
  pnpm:
    description: "Whether to run pnpm build"
    required: true
    default: "true"
  pnpm-build-filter:
    description: "The filter argument for pnpm build (e.g. ./packages/*)"
    required: false
    default: "./packages/*"
  gui:
    description: "Whether to prepare the GUI build environment"
    required: true
    default: "true"
  token:
    description: "GitHub token, used by setup-protoc action"
    required: false
runs:
  using: "composite"
  steps:
    - run: mkdir -p packages/studio/dist
      shell: bash

    - name: Install dependencies
      if: ${{ runner.os == 'Linux' }}
      run: |
        sudo apt-get update
        sudo apt-get install -qqy build-essential mold musl-tools
      shell: bash

    - name: Setup protoc
      uses: ./.github/actions/setup-protoc
      with:
        version: "35.1"
        token: ${{ inputs.token }}

    - name: Verify protoc version
      run: |
        version="$(protoc --version | tr -d '\r')"
        test "$version" = "libprotoc 35.1"
      shell: bash

    - name: Setup Frontend Environment
      if: ${{ inputs.pnpm == 'true' }}
      uses: ./.github/actions/prepare-pnpm
      with:
        token: ${{ inputs.token }}
        build-filter: ${{ inputs.pnpm-build-filter }}

    - name: Install GUI dependencies (Linux)
      if: ${{ inputs.gui == 'true' && runner.os == 'Linux' }}
      run: |
        sudo apt-get install -qq xdg-utils \
        libappindicator3-dev \
        libgtk-3-dev \
        librsvg2-dev \
        libwebkit2gtk-4.1-dev \
        libxdo-dev
      shell: bash

    # VC-LTL：thunk-rs 的构建脚本会 curl 下载 VC-LTL-Binary.7z（无重试），
    # 历史上多次因 GitHub 504 直接 panic 打挂 Windows 构建。这里预下载 + 缓存，
    # 并用 `VC_LTL` 让 thunk-rs 跳过下载。
    - name: Cache VC-LTL
      if: runner.os == 'Windows'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: C:/vc-ltl
        key: vc-ltl-5.2.2

    - name: Setup VC-LTL
      if: runner.os == 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        version=5.2.2
        root="C:/vc-ltl"
        target="$(find "$root" -maxdepth 3 -type d -name TargetPlatform 2>/dev/null | head -1 || true)"
        if [ -z "$target" ]; then
          for attempt in 1 2 3 4 5; do
            if curl --retry 5 --retry-all-errors --retry-delay 3 -fsSL -o "$RUNNER_TEMP/vc-ltl.7z" \
                "https://github.com/Chuyu-Team/VC-LTL5/releases/download/v${version}/VC-LTL-Binary.7z"; then
              break
            fi
            echo "::warning::VC-LTL 下载失败（第 ${attempt} 次），重试…"
            sleep $((attempt * 3))
          done
          mkdir -p "$root"
          7z x -y -o"$root" "$RUNNER_TEMP/vc-ltl.7z" >/dev/null
          target="$(find "$root" -maxdepth 3 -type d -name TargetPlatform 2>/dev/null | head -1 || true)"
        fi
        if [ -z "$target" ]; then
          echo "::warning::VC-LTL 不可用，本次构建跳过 thunk（不影响 Windows 10/11）"
          echo "EXVLAN_SKIP_THUNK=1" >> "$GITHUB_ENV"
          exit 0
        fi
        echo "VC_LTL=$(dirname "$target")" >> "$GITHUB_ENV"
        echo "VC-LTL ready: $(dirname "$target")"

    # YY-Thunks：thunk-rs 的第二个外链下载（同样会因 GitHub 504 打挂 Windows 构建）
    - name: Cache YY-Thunks
      if: runner.os == 'Windows'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: C:/yy-thunks
        key: yy-thunks-1.1.7

    - name: Setup YY-Thunks
      if: runner.os == 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        version=1.1.7
        root="C:/yy-thunks"
        target="$(find "$root" -maxdepth 3 -type d -name objs 2>/dev/null | head -1 || true)"
        if [ -z "$target" ]; then
          for attempt in 1 2 3 4 5; do
            if curl --retry 5 --retry-all-errors --retry-delay 3 -fsSL -o "$RUNNER_TEMP/yy-thunks.zip" \
                "https://github.com/Chuyu-Team/YY-Thunks/releases/download/v${version}/YY-Thunks-Objs.zip"; then
              break
            fi
            echo "::warning::YY-Thunks 下载失败（第 ${attempt} 次），重试…"
            sleep $((attempt * 3))
          done
          mkdir -p "$root"
          7z x -y -o"$root" "$RUNNER_TEMP/yy-thunks.zip" >/dev/null || true
          target="$(find "$root" -maxdepth 3 -type d -name objs 2>/dev/null | head -1 || true)"
        fi
        if [ -z "$target" ]; then
          echo "::warning::YY-Thunks 不可用，本次构建跳过 thunk（不影响 Windows 10/11）"
          echo "EXVLAN_SKIP_THUNK=1" >> "$GITHUB_ENV"
          exit 0
        fi
        echo "YY_THUNKS=$(dirname "$target")" >> "$GITHUB_ENV"
        echo "YY-Thunks ready: $(dirname "$target")"

    - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
      with:
        toolchain: 1.95
        target: ${{ !contains(inputs.target, 'mips') && inputs.target || '' }}
        components: ${{ contains(inputs.target, 'mips') && 'rust-src' || '' }}
        cache: false
        rustflags: ""

    - name: Install Rust (MIPS)
      if: ${{ contains(inputs.target, 'mips') }}
      run: |
        MUSL_TARGET=${{ inputs.target }}sf
        mkdir -p ./musl_gcc
        wget --inet4-only -c https://github.com/cross-tools/musl-cross/releases/download/20250520/${MUSL_TARGET}.tar.xz -P ./musl_gcc/
        tar xf ./musl_gcc/${MUSL_TARGET}.tar.xz -C ./musl_gcc/
        sudo ln -sf $(pwd)/musl_gcc/${MUSL_TARGET}/bin/*gcc /usr/bin/
        sudo ln -sf $(pwd)/musl_gcc/${MUSL_TARGET}/include/ /usr/include/musl-cross
        sudo ln -sf $(pwd)/musl_gcc/${MUSL_TARGET}/${MUSL_TARGET}/sysroot/ ./musl_gcc/sysroot
        sudo chmod -R a+rwx ./musl_gcc

        if [[ -d "./musl_gcc/sysroot" ]]; then
          echo "BINDGEN_EXTRA_CLANG_ARGS=--sysroot=$(readlink -f ./musl_gcc/sysroot)" >> $GITHUB_ENV
        fi

        cd "$PWD/musl_gcc/${MUSL_TARGET}/lib/gcc/${MUSL_TARGET}/15.1.0" || exit 255
        # for panic-abort
        cp libgcc_eh.a libunwind.a

        # for mimalloc
        ar x libgcc.a _ctzsi2.o _clz.o _bswapsi2.o
        ar rcs libctz.a _ctzsi2.o _clz.o _bswapsi2.o
      shell: bash
