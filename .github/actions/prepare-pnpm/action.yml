name: 'Setup pnpm'
author: Luna
description: 'Setup Node.js, pnpm, and install dependencies'

inputs:
  token:
    description: 'GitHub token, used by setup-protoc action'
    required: false
  build-filter:
    description: 'The filter argument for pnpm build (e.g. packages/studio)'
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      with:
        toolchain: 1.95
        target: wasm32-unknown-unknown
        cache: false
        rustflags: ''

    - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
      with:
        tool: wasm-pack

    - uses: ./.github/actions/setup-protoc
      with:
        version: '35.1'
        token: ${{ inputs.token }}

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: 25

    - name: Install pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      with:
        version: 11
        run_install: false

    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Setup pnpm cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Source env
      shell: bash
      run: |
        if [ -f .env.secret ]; then
          set -a
          source .env.secret
          set +a
        fi

    - name: Install and build
      shell: bash
      run: |
        pnpm -r install
        if [ -n "${{ inputs.build-filter }}" ]; then
          echo "Building with filter: ${{ inputs.build-filter }}"
          pnpm -r --workspace-concurrency=1 --filter "${{ inputs.build-filter }}" build
        else
          echo "No build filter provided, building all packages"
          pnpm -r --workspace-concurrency=1 build
        fi

    - name: Bundle config generator with web frontend
      shell: bash
      run: |
        if [ -f packages/ui/dist/index.html ] && [ -f packages/generator/dist/index.html ]; then
          mkdir -p packages/ui/dist/config-generator
          cp -R packages/generator/dist/. packages/ui/dist/config-generator/
        fi
