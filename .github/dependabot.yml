version: 2

# 仅用于承载 ignore（抑制上游阻塞依赖的自动升级尝试）；不启用常规版本更新。
# 安全更新仍由仓库的 "Dependabot security updates" 设置驱动。
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    # 0 = 不开启常规版本更新 PR；安全更新不受此项限制
    open-pull-requests-limit: 0
    ignore:
      # 上游阻塞：hickory-client/server 无稳定 0.26（仅 alpha）；glib 0.18 属 gtk-rs 0.18 栈，
      # 升 0.20 需 tauri/wry 的 GTK 栈大版本升级。
      # 跟踪见 issue #1；复核日期见 .cargo/audit-allowlist.toml（review_by=2027-01-31）。
      - dependency-name: "hickory-proto"
      - dependency-name: "hickory-resolver"
      - dependency-name: "hickory-client"
      - dependency-name: "hickory-server"
      - dependency-name: "glib"
