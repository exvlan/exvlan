# 上游路径拆分映射（单一事实源）
# 用途：upstream (EasyTier) → EXVlan 布局映射；供 skill 脚本与文档引用，避免漂移。
# 参考：docs/rules/workflow/upstream-sync.md
version: v2.7.0
upstream_remote: git@github.com:EasyTier/EasyTier.git
upstream_ref: upstream/releases/v2.7.0

# rebrand 分类（防误伤；详见 SKILL.md）
# - wire 常量（KDF/Noise/proof/HKDF）: 改为 exvlan（fork 自洽；不再与上游互通；需同步测试断言）
# - WASI 宿主 ABI 名（exvlan_host/exvlan_buffer_*/…）: 六面必须同向；改动后重建 wasm
# - 品牌/本地名（日志/socket/CLI）: exvlan
# - 外部依赖（tun-easytier、github.com/EasyTier/*）: 保留原名
rebrand_taxonomy: { wire: exvlan, wasi_abi: exvlan, brand: exvlan, external: keep }

# 忽略（本仓库不跟踪，见 .gitignore）
ignore:
  - Cargo.lock
  - pnpm-lock.yaml
  - package-lock.json
  - flake.lock

# 直接采纳（不改路径）
adopt:
  - .cargo
  - .config
  - .envrc
  - .gitattributes
  - .gitignore
  - assets
  - script
  - android.nix
  - flake.nix
  - rust-toolchain.toml
  - Cargo.toml
  - package.json
  - pnpm-workspace.yaml
  - README.md
  - README_CN.md
  - CONTRIBUTING.md
  - CONTRIBUTING_zh.md
  - LICENSE
  - docs # 归仓库根 docs/（内容品牌化）

# 我方独有（无上游对应）
local_only:
  - AGENTS.md
  - CLAUDE.md
  - UPSTREAM_SYNC.md
  - rules.md
  - .env
  - .vite-hooks
  - compose.mobile.yml
  - compose.test.yml
  - Dockerfile.mobile
  - Dockerfile.test
  - vite.config.ts
  - exvlan.code-workspace # ← 由上游 EasyTier.code-workspace 改名

# 重命名 / 拆分映射（upstream 一律用上游原名 easytier*）
map:
  # --- 主 crate 与拆分出的 crate ---
  - { upstream: easytier, target: exvlan/exvlan, note: 主 native crate（bin exvlan/exvlan-cli） }
  - { upstream: easytier-core, target: exvlan/core, note: wasi 可移植核心 }
  - { upstream: easytier-proto, target: exvlan/proto, note: proto+rpc（自带 build/ 生成器） }
  - { upstream: easytier-rpc-build, target: exvlan/proto/build, note: 上游删除，折入 proto }
  - { upstream: easytier-go, target: exvlan/go, module: github.com/exvlan/exvlan/exvlan-go }

  # --- web 四向拆分 ---
  - { upstream: easytier-web/src, target: exvlan/api, note: 后端 config server }
  - { upstream: easytier-web/frontend-lib, target: packages/std, package: "@exvlan/std" }
  - { upstream: easytier-web/frontend, target: packages/ui, package: "@exvlan/ui" }
  - { upstream: easytier-web/config-generator, target: packages/generator, package: "@exvlan/generator" }

  # --- 桌面 / JS ---
  - { upstream: easytier-gui, target: packages/studio }
  - { upstream: easytier-js, target: packages/sdk, package: "@exvlan/sdk", note: 保留嵌套 pnpm-workspace }

  # --- contrib ---
  - { upstream: easytier-contrib/easytier-android-jni, target: exvlan/contrib/android-jni, crate: exvlan-android-jni }
  - { upstream: easytier-contrib/easytier-ffi, target: exvlan/contrib/ffi, crate: exvlan-ffi }
  - { upstream: easytier-contrib/easytier-ios, target: exvlan/contrib/ios, crate: exvlan-ios, new: true }
  - { upstream: easytier-contrib/easytier-magisk, target: exvlan/contrib/magisk }
  - { upstream: easytier-contrib/easytier-mini, target: exvlan/contrib/mini, crate: exvlan-mini, new: true }
  - { upstream: easytier-contrib/easytier-ohrs, target: exvlan/contrib/ohrs, crate: exvlan-ohrs }
  - { upstream: easytier-contrib/easytier-uptime, target: exvlan/contrib/uptime, crate: exvlan-uptime }

  # --- 插件 / 顶层配置 ---
  - { upstream: tauri-plugin-vpnservice, target: exvlan/plugin/vpnservice }
  - { upstream: .github, target: .github, note: 全面吸收 + 改品牌（保留我方 runner/docker 标签） }
  - { upstream: EasyTier.code-workspace, target: exvlan.code-workspace }
  - { upstream: CONTEXT.md, target: CONTEXT.md, note: 品牌化 }
  - { upstream: docs, target: docs, note: 归仓库根 docs/，品牌化 }

# 依赖链（v2.7.0 架构）
dependency_chain:
  - exvlan/exvlan -> exvlan-core
  - exvlan-core  -> exvlan-proto
