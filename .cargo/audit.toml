# cargo-audit 配置：CI 依赖审计门禁的**允许清单**。
# 语义：清单内的告警为「已评估并接受」；任何**不在**清单内的新漏洞会让 `cargo audit` 退出非零 → 门禁红灯。
# 元数据（理由 + 到期复核日）在 `.cargo/audit-allowlist.toml`，由 `script/check_audit_allowlist.py` 在 CI 校验：
# 两处 id 集合必须一致，且过期即失败。
[advisories]
ignore = [
  # rsa 0.9.10 —— Marvin 时序侧信道。传递依赖，非本仓直接引入；当前仅经 TLS/JWT 链间接使用。
  "RUSTSEC-2023-0071",
  # hickory-proto 0.25.2 —— 上游 0.26.x 才有补丁（见 issues #1 / #6）；Dependabot 亦列为可修。
  "RUSTSEC-2026-0118",
  "RUSTSEC-2026-0119",
  # hickory-proto 0.25.2 —— 2026-09-03 新披露的 4 条（同上，0.26 四件套仍未齐：
  # hickory-client 只有 0.26.0-alpha.1）。全部需要**恶意 DNS 响应**触发，
  # 影响面是内核/GUI 的 DNS 解析路径（在 tokio task 内，panic 不会带走进程）。
  "RUSTSEC-2026-0487",
  "RUSTSEC-2026-0489",
  "RUSTSEC-2026-0490",
  "RUSTSEC-2026-0491",
  # hickory-proto/resolver 0.25.2 —— 2026-09-03 DNSSEC 批次（4 条 proto + 1 条 resolver）。
  # 触发条件全是「开启 DNSSEC 校验时信任了错误的签名链」，而我们从不开
  # `ResolverOpts::validate`（默认 false，仓内无任何地方开启）；
  # 升级同样被 hickory-client 0.26 缺位阻塞（只有 0.26.0-alpha.1）。
  "RUSTSEC-2026-0504",
  "RUSTSEC-2026-0505",
  "RUSTSEC-2026-0511",
  "RUSTSEC-2026-0512",
  "RUSTSEC-2026-0514",
  # crypto-bigint 0.5.5 —— 经 openidconnect 4.0.1 → p256 0.13 → ecdsa 0.16 → elliptic-curve 0.13 引入；
  # 上游 openidconnect 尚无 0.7 链路（最新仍 4.0.1），仅影响 API 的 OIDC 签名验证路径。见 issue #7。
  "RUSTSEC-2026-0387",
  # libsqlite3-sys 0.30.1（经 sqlx 0.8.6 引入）—— SQLite CVE-2026-119375（2026-10-30 新披露）。
  # 升级需 libsqlite3-sys >= 0.39，当前被 sea-orm 1.1.20 → sqlx 0.8 锁定；待 sqlx/sea-orm 链升级后移除。
  "RUSTSEC-2026-0459",
]
