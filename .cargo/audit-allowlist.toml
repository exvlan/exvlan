# --- hickory-proto 0.25.2 的 2026-09-03 批次（上游统一在 0.26.2 修复）---
# 共同背景：内核直接 pin 了 hickory-proto/client/resolver/server 0.25.2
# （`exvlan/exvlan/src/common/dns.rs`，dns-resolver feature）。0.26 的
# proto/resolver/server 已是 0.26.3，但 **hickory-client 仍只有 0.26.0-alpha.1**，
# 四件套无法协同升级。四条的触发条件都需要**恶意/异常 DNS 响应**，
# 且都发生在 tokio task 内（panic 只让该任务失败，不会带走进程）。
