[package]
name = "exvlan-studio"
version = "26.410.20705"
description = "Exvlan GUI"
authors = ["you"]
edition.workspace = true
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]


[dependencies]
# wry 0.47 may crash on android, see https://github.com/exvlan/exvlan/issues/527
tauri = { workspace = true, features = ["tray-icon", "image-png", "image-ico", "devtools"] }

serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

# 桌面端只依赖「管理/客户端」层的轻量 crate，不再静态链接内核（exvlan）。
# 移动端（Android / iOS）仍需内核库（tauri-plugin-vpnservice 走进程内实例）。
exvlan-core = { workspace = true, default-features = false, features = ["management"] }
exvlan-proto = { workspace = true, features = ["api", "core"] }
exvlan-rpc = { workspace = true, features = ["logging", "management"] }
tokio = { workspace = true, default-features = true, features = ["full"] }
anyhow.workspace = true

once_cell.workspace = true
dashmap.workspace = true


tauri-plugin-shell = "2.3.6"
tauri-plugin-process = "2.3.1"
tauri-plugin-clipboard-manager = "2.3.3"
tauri-plugin-os = "2.3.2"

uuid.workspace = true
async-trait.workspace = true

url = { workspace = true, features = ["serde"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
winapi = { workspace = true, features = ["securitybaseapi", "processthreadsapi"] }

[target.'cfg(target_family = "unix")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework-sys = "2.17.0"


[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
thunk-rs = { workspace = true, features = ["win7"] }


[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.4.4"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
exvlan = { workspace = true, default-features = true }
tauri-plugin-vpnservice = { path = "../../../exvlan/plugin/vpnservice" }

[package.metadata.cargo-machete]
ignored = [
  # Called by build.rs; thunk is only used on Windows.
  "tauri-build",
  "thunk-rs",
]
