[package]
name = "exvlan-studio"
version = "26.410.20712"
description = "Exvlan GUI"
authors = ["you"]
edition.workspace = true
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]


[dependencies]
# wry 0.47 may crash on android, see https://github.com/exvlan/exvlan/issues/527
tauri = { workspace = true, features = ["tray-icon", "image-png", "image-ico", "devtools"] }

serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml.workspace = true

# 注：exvlan-rpc 按平台分别声明（见文件末尾的 target 段）——
# 桌面需要 `gui-client`（含 exvlan-core），移动端只要 `ffi-rpc`。
# 若在此处写 `gui-client`，feature 统一会把 exvlan-core 拉回移动端依赖树。
# exvlan-core / exvlan-proto 通过 exvlan-rpc re-export 使用，这里不再直接依赖
reqwest = { workspace = true, features = ["json", "rustls", "http2"] }
sha2 = "0.10"
tempfile.workspace = true
zip = "9.1.3"
tokio = { workspace = true, default-features = true, features = ["full"] }
anyhow.workspace = true
tracing.workspace = true

once_cell.workspace = true
dashmap.workspace = true


tauri-plugin-shell = "2.3.6"
tauri-plugin-process = "2.3.1"
tauri-plugin-clipboard-manager = "2.3.3"
tauri-plugin-os = "2.3.2"

uuid.workspace = true
async-trait.workspace = true

url = { workspace = true, features = ["serde"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
winapi = { workspace = true, features = ["securitybaseapi", "processthreadsapi"] }

[target.'cfg(target_family = "unix")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework-sys = "2.17.0"


[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
thunk-rs = { workspace = true, features = ["win7"] }


[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# 桌面端只依赖「管理/客户端」层的轻量 crate，不再静态链接内核（exvlan）。
exvlan-rpc = { workspace = true, features = ["logging", "management", "gui-client"] }
tauri-plugin-single-instance = "2.4.4"
# 桌面：官方 updater（签名校验 + 自动替换）；移动端由自建 APK 流程处理。
tauri-plugin-updater = "2.9.0"

[target.'cfg(target_os = "android")'.dependencies]
# Android 上 reqwest(rustls) 依赖 rustls-platform-verifier，必须先初始化，
# 否则第一次 HTTPS 就会 panic（"Expect rustls-platform-verifier to be initialized"）。
jni = { version = "0.22", default-features = false }
ndk-context = "0.1"
rustls-platform-verifier = "0.7"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
# P7：移动端不再链接内核 crate；内核以预编译库（libexvlan_ffi.so）+ C ABI 提供。
# 注意：**不要**加 `gui-client`/`rpc`——那会把 exvlan-core 拉回移动端依赖树。
exvlan-rpc = { workspace = true, features = ["logging", "management", "ffi-rpc"] }
tauri-plugin-vpnservice = { path = "../../../exvlan/plugin/vpnservice" }

[package.metadata.cargo-machete]
ignored = [
  # Called by build.rs; thunk is only used on Windows.
  "tauri-build",
  "thunk-rs",
]
