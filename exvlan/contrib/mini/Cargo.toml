[package]
name = "exvlan-mini"
description = "Minimal native Exvlan node with TCP/UDP tunnels, TUN and UDP hole punching."
version = "26.410.20701"
edition.workspace = true
rust-version.workspace = true
license-file = "../../LICENSE"
build = "build.rs"

[dependencies]
anyhow.workspace = true
exvlan = { workspace = true, features = [
  "aes-gcm",
  "dhcp-ipv4",
  "logging",
  "proxy-cidr-monitor",
  "smoltcp",
  "tun",
  "web-client",
] }
tokio = { workspace = true, features = ["macros", "rt", "signal"] }
