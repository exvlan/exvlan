[package]
name = "exvlan-ffi"
version = "2026.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
exvlan = { path = "../../core" }

once_cell = "1.18.0"
dashmap = "6.0"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
uuid = "1.17.0"

[profile.dev]
incremental = true # 以较小的步骤编译您的二进制文件。

[profile.release]
codegen-units = 1 # 允许 LLVM 执行更好的优化。
lto = true # 启用链接时优化。
opt-level = "s" # 优先考虑小的二进制文件大小。如果您更喜欢速度，请使用 `3`。
panic = "abort" # 通过禁用 panic 处理程序来提高性能。
strip = true # 确保移除调试符号。