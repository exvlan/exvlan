[package]
name = "exvlan-ffi"
version = "26.410.20705"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["c-abi", "ffi-dataplane"]
c-abi = []
ffi-dataplane = ["exvlan/ffi-dataplane", "exvlan-core/proxy-smoltcp-stack"]

[dependencies]
exvlan = { workspace = true, default-features = true, features = ["tracing-log"] }
exvlan-core = { workspace = true, default-features = true }

once_cell.workspace = true
tokio = { workspace = true, default-features = true, features = [
  "rt-multi-thread",
  "io-util",
  "time",
  "sync",
  "macros",
] }
async-trait.workspace = true
log.workspace = true

serde_json.workspace = true
uuid.workspace = true

[build-dependencies]
thunk-rs = { workspace = true, features = ["win7"] }

[package.metadata.cargo-machete]
ignored = [
  # Windows-only build.rs setup calls thunk::thunk().
  "thunk-rs",
]
