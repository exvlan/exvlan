[package]
name = "exvlan-ffi"
version = "26.410.20715"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["c-abi", "ffi-dataplane"]
c-abi = []
ffi-dataplane = ["exvlan/ffi-dataplane", "exvlan-core/proxy-smoltcp-stack"]

[dependencies]
exvlan = { workspace = true, default-features = true, features = ["tracing-log"] }
exvlan-core = { workspace = true, default-features = true }
exvlan-rpc = { workspace = true, features = ["logging", "management"] }

once_cell.workspace = true
tokio = { workspace = true, default-features = true, features = [
  "rt-multi-thread",
  "io-util",
  "time",
  "sync",
  "macros",
] }
async-trait.workspace = true
log.workspace = true

serde_json.workspace = true
uuid.workspace = true

# 一次性迁移（Android 首启）：迁移核心在 lib 里，这里只暴露 C ABI。
exvlan-migrate = { path = "../../migrate" }

[dev-dependencies]
# 仅测试用：构造与移动端一致的 protobuf JSON 请求
exvlan-proto = { workspace = true }

[build-dependencies]
thunk-rs = { workspace = true, features = ["win7"] }

[package.metadata.cargo-machete]
ignored = [
  # Windows-only build.rs setup calls thunk::thunk().
  "thunk-rs",
]
