[package]
name = "exvlan-ohrs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
bytes.workspace = true
exvlan = { workspace = true, default-features = true }
exvlan-core.workspace = true
exvlan-ohos-core.workspace = true
exvlan-ohos-features.workspace = true
exvlan-proto = { workspace = true, features = [
    "api",
    "core",
    "json-rpc",
] }
futures.workspace = true
napi-derive-ohos = "1.1"
napi-ohos = { version = "1.1", default-features = false, features = [
    "serde-json",
    "latin1",
    "chrono_date",
    "object_indexmap",
    "tokio",
    "async",
    "tokio_rt",
    "tokio_macros",
    "tokio_io_util",
    "deferred_trace",
    "napi8",
    "web_stream",
] }
once_cell.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, default-features = true }
url.workspace = true
uuid = { workspace = true, features = [
    "v4",
    "fast-rng",
    "macro-diagnostics",
    "serde",
] }

[build-dependencies]
napi-build-ohos = "1.1"
