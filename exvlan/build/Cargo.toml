[package]
name = "exvlan-rpc-build"
description = "Protobuf RPC Service Generator for EXVlan"
version = "2026.1.0"
edition = "2021"
homepage = "https://github.com/exvlan/exvlan"
repository = "https://github.com/exvlan/exvlan"
authors = ["<@长久同学 cloud@era-x.cn>"]
keywords = ["vpn", "p2p", "network", "exvlan"]
categories = ["network-programming", "command-line-utilities"]
rust-version = "1.93.0"
license-file = "LICENSE"
readme = "README.md"

[dependencies]
heck = "0.5"
prost-build = "0.13"

[features]
default = []
internal-namespace = []

[profile.dev]
incremental = true # 以较小的步骤编译您的二进制文件。

[profile.release]
codegen-units = 1 # 允许 LLVM 执行更好的优化。
lto = true # 启用链接时优化。
opt-level = "s" # 优先考虑小的二进制文件大小。如果您更喜欢速度，请使用 `3`。
panic = "abort" # 通过禁用 panic 处理程序来提高性能。
strip = true # 确保移除调试符号。