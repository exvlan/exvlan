[package]
name = "exvlan-control"
version = "26.410.20712"
edition.workspace = true
rust-version.workspace = true
license-file = "../../exvlan/LICENSE"
description = "EXVlan local control-plane client: service IPC + backend detection + shared paths (used by GUI / CLI / gateway)"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml.workspace = true
sha2.workspace = true
uuid = { workspace = true, features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# 取当前用户 SID（命名管道 ACL 收窄）。纯 Rust 绑定，可交叉编译验证。
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

[features]
# `protocol` 只依赖 serde/serde_json：特权服务仅需要协议类型时启用它，
# 不会把 uuid/sha2/windows-sys 与 IPC 客户端连坐进 root 二进制。
default = []
protocol = []
