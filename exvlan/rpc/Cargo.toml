[package]
name = "exvlan-rpc"
description = "Protobuf RPC Client for exvlaln"
version = "26.20617.020604"
edition.workspace = true
homepage = "https://github.com/exvlan/exvlan"
repository = "https://github.com/exvlan/exvlan"
rust-version.workspace = true
authors = ["<@长久同学 cloud@era-x.cn>"]
keywords = ["vpn", "p2p", "network", "exvlan"]
categories = ["network-programming", "command-line-utilities"]
license-file = "LICENSE"
readme = "README.md"

[dependencies]
tokio = { version = "1.35.1", features = ["full"] }
anyhow = "1.0.102"
tracing = "0.1.40"
thiserror = "1.0.56"
exvlan = { path = "../core" }
uuid = "1.5.0"

[features]
default = []
integration-test = []

[dev-dependencies]
tokio = { version = "1.35.1", features = ["test-util"] }
mockall = "0.12.0"
assert_matches = "1.5.0"
serial_test = "2.0"
anyhow = "1.0.102"
url = "2.5"