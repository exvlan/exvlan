[package]
name = "exvlan-gateway"
version = "26.410.20712"
edition.workspace = true
rust-version.workspace = true
license-file = "../../exvlan/LICENSE"
description = "EXVlan local control plane (HTTP/JSON + WebSocket) for CLI / agents / remote clients"

[[bin]]
name = "exvlan-gateway"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["ws", "json", "tokio"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros", "time", "signal"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
exvlan-service-client = { path = "../service-client" }
exvlan-rpc = { path = "../rpc", features = ["rpc"] }
# `NetworkConfigExt`（TOML ↔ NetworkConfig）在 `browser-config` 下启用：
# PATCH /instances/{id} {disabled:false} 要从配置目录读回配置再拉起实例。
exvlan-core = { path = "../core", features = ["browser-config"] }
uuid.workspace = true
